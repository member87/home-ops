---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - sealedsecret.yaml
  - cronjob.yaml
# Generated so a config change gets a new name and the next Job mounts it.
configMapGenerator:
  - name: chore-bore-config
    namespace: chore-bore
    files:
      - config.json
      - mint-token.mjs
