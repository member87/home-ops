---
# Private key of the "Chore Bore" GitHub App (App ID in cronjob.yaml). A leaked key lets the holder
# act as chore-bore[bot] on member87/home-ops: revoke it under App settings -> Private keys.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: chore-bore-secrets
  namespace: chore-bore
spec:
  encryptedData:
    private-key.pem: 
  template:
    metadata:
      name: chore-bore-secrets
      namespace: chore-bore
