# Grafana alert rules for crowdsec, applied by the grafana Terrakube workspace
# (terraform/grafana/alerting.tf). Every alerts/*.yaml here joins one rule group named
# "crowdsec" in the Alerts folder; the rule fields are Grafana's file-provisioning format.
rules:
  - uid: crowdsec-ban-activity
    title: CrowdSec Ban Activity
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 900
          to: 0
        datasourceUid: loki
        model:
          expr: 'sum(count_over_time({namespace="crowdsec", filename=~".+"} |~ "ban on Ip" [15m]))'
          refId: A
      - refId: B
        relativeTimeRange:
          from: 900
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 900
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 0
                type: gt
    noDataState: OK
    execErrState: OK
    for: 1m
    annotations:
      summary: CrowdSec is actively banning IPs
      description: CrowdSec has issued {{ $value }} ban decisions in the last 15 minutes.
    labels:
      severity: warning
