---
# CrowdSec acquisition configuration - reads logs from Loki
apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-acquis
  namespace: crowdsec
data:
  # Local config override to point to custom acquisition directory
  config.yaml.local: |
    crowdsec_service:
      acquisition_dir: /etc/crowdsec/acquis-loki
  # Traefik access logs for the public hosts (FRP -> Caddy -> Traefik). Caddy sets
  # X-Forwarded-For, so ClientHost is the real client IP that crowdsecurity/traefik-logs
  # takes as source_ip. *.lab.jackhumes.com traffic is dropped at query time: it only ever
  # comes from private addresses, which crowdsecurity/whitelists discards anyway. Match on
  # RequestHost, not the raw line: Pocket ID /authorize paths carry lab redirect_uris.
  traefik.yaml: |
    source: loki
    url: http://loki.loki.svc.cluster.local:3100
    query: |
      {namespace="traefik", container="traefik"} |= "DownstreamStatus" | json RequestHost | RequestHost !~ `.+\.lab\.jackhumes\.com`
    labels:
      type: traefik
    log_level: info
    # Never give up on Loki. The agent and LAPI share this process, and a datasource
    # error is fatal to it: with the defaults (30s retry, 10s startup /ready wait) a
    # Loki restart killed LAPI and the fail-closed bouncers 403'd Pocket ID. Retrying
    # keeps LAPI serving decisions; the query resumes from the last seen timestamp, so
    # lines Loki ingests during the outage are still parsed once it is back.
    no_ready_check: true
    max_failure_duration: 8760h
