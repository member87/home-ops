---
# CrowdSec LAPI + Agent - decision engine with log parsing
# Reads Traefik access logs from Loki for HTTP scanning/brute-force detection
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec
  namespace: crowdsec
  labels:
    app: crowdsec
spec:
  replicas: 1
  # Single replica on an RWO volume: a RollingUpdate deadlocks on Multi-Attach when the
  # replacement pod schedules on another node. Recreate releases the volume first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: crowdsec
  template:
    metadata:
      labels:
        app: crowdsec
      annotations:
        # Picked up by the kubernetes-pods job; cs_active_decisions etc. feed the
        # CrowdSec Security dashboard.
        prometheus.io/scrape: "true"
        prometheus.io/port: "6060"
        prometheus.io/path: /metrics
        # Acquisition is only read at startup and crowdsec-acquis is a plain ConfigMap;
        # bump this when it changes so the pod rolls.
        checksum/acquis: "loki-no-giveup-v1"
    spec:
      serviceAccountName: crowdsec
      containers:
        - name: crowdsec
          image: crowdsecurity/crowdsec:v1.8.1
          env:
            # Register the Traefik bouncer with this API key
            - name: BOUNCER_KEY_traefik
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: BOUNCER_KEY
            # Install collections - Traefik and base HTTP scenarios for protection
            - name: COLLECTIONS
              value: "crowdsecurity/traefik crowdsecurity/base-http-scenarios"
          ports:
            - name: lapi
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 6060
              protocol: TCP
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          volumeMounts:
            - name: crowdsec-data
              mountPath: /var/lib/crowdsec/data
              subPath: data
            # The image seeds missing files from /staging/etc/crowdsec on every start
            # (rsync --ignore-existing), so an empty volume bootstraps itself and a
            # populated one keeps its CAPI credentials and local machine registration.
            - name: crowdsec-data
              mountPath: /etc/crowdsec
              subPath: config
            - name: acquis-config
              mountPath: /etc/crowdsec/acquis-loki/
              readOnly: true
            - name: acquis-config
              mountPath: /etc/crowdsec/config.yaml.local
              subPath: config.yaml.local
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: lapi
            initialDelaySeconds: 90
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: lapi
            initialDelaySeconds: 45
            periodSeconds: 5
        # Never ban the home WAN IP. LAN clients resolving the public hostnames hairpin
        # out through the edge and come back from this address, so normal use of Pocket
        # ID and Dawarich would otherwise trip the crawl/probing scenarios. The ISP
        # changes the address daily, and it must not live in Git, so this keeps the LAPI
        # allowlist `home-wan` (stored in the database) pointed at the cluster's own
        # egress IP. Two independent lookups must agree before anything is allowlisted,
        # so one lying echo service cannot exempt an arbitrary address. `add` does not
        # refresh an existing value, so the list is rebuilt only when the IP changes,
        # and any ban already placed on the new address is lifted.
        - name: wan-allowlist
          image: crowdsecurity/crowdsec:v1.8.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              current=""
              while true; do
                a=$(wget -qO- -T 10 https://ifconfig.me/ip 2>/dev/null)
                b=$(wget -qO- -T 10 https://api.ipify.org 2>/dev/null)
                if [ -n "$a" ] && [ "$a" = "$b" ] && echo "$a" | grep -Eqx '([0-9]{1,3}\.){3}[0-9]{1,3}'; then
                  if [ "$a" != "$current" ]; then
                    cscli allowlists delete home-wan >/dev/null 2>&1
                    if cscli allowlists create home-wan -d "home WAN IP, kept current by the wan-allowlist sidecar" \
                      && cscli allowlists add home-wan "$a" -d "home WAN" \
                      && cscli decisions delete --ip "$a"; then
                      current=$a
                      echo "home-wan allowlist updated"
                    fi
                  fi
                else
                  echo "WAN IP lookups failed or disagree; allowlist left unchanged"
                fi
                if [ -n "$current" ]; then sleep 300; else sleep 30; fi
              done
          resources:
            requests:
              memory: 16Mi
              cpu: 5m
            limits:
              memory: 64Mi
              cpu: 100m
          volumeMounts:
            - name: crowdsec-data
              mountPath: /var/lib/crowdsec/data
              subPath: data
            - name: crowdsec-data
              mountPath: /etc/crowdsec
              subPath: config
      volumes:
        - name: crowdsec-data
          persistentVolumeClaim:
            claimName: crowdsec-data
        - name: acquis-config
          configMap:
            name: crowdsec-acquis
