---
# CrowdSec LAPI + Agent - decision engine with log parsing
# Reads Traefik access logs from Loki for HTTP scanning/brute-force detection
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec
  namespace: crowdsec
  labels:
    app: crowdsec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crowdsec
  template:
    metadata:
      labels:
        app: crowdsec
      annotations:
        # Picked up by the kubernetes-pods job; cs_active_decisions etc. feed the
        # CrowdSec Security dashboard.
        prometheus.io/scrape: "true"
        prometheus.io/port: "6060"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: crowdsec
      containers:
        - name: crowdsec
          image: crowdsecurity/crowdsec:v1.8.1
          env:
            # Register the Traefik bouncer with this API key
            - name: BOUNCER_KEY_traefik
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: BOUNCER_KEY
            # Install collections - Traefik and base HTTP scenarios for protection
            - name: COLLECTIONS
              value: "crowdsecurity/traefik crowdsecurity/base-http-scenarios"
          ports:
            - name: lapi
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 6060
              protocol: TCP
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          volumeMounts:
            - name: crowdsec-data
              mountPath: /var/lib/crowdsec/data
            - name: acquis-config
              mountPath: /etc/crowdsec/acquis-loki/
              readOnly: true
            - name: acquis-config
              mountPath: /etc/crowdsec/config.yaml.local
              subPath: config.yaml.local
              readOnly: true
            - name: whitelist
              mountPath: /etc/crowdsec/parsers/s02-enrich/home-wan-whitelist.yaml
              subPath: home-wan-whitelist.yaml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: lapi
            initialDelaySeconds: 90
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: lapi
            initialDelaySeconds: 45
            periodSeconds: 5
      volumes:
        - name: crowdsec-data
          emptyDir: {}
        - name: acquis-config
          configMap:
            name: crowdsec-acquis
        - name: whitelist
          configMap:
            name: crowdsec-whitelist
