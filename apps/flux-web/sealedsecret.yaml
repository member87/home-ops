# with https://flux.lab.jackhumes.com/oauth2/callback added to its callback URLs.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: flux-web-client
  namespace: flux-system
spec:
  encryptedData:
    client-id: 
    client-secret: 
  template:
    metadata:
      name: flux-web-client
      namespace: flux-system
    type: Opaque
