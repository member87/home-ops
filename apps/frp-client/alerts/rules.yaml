# Grafana alert rules for frp-client, applied by the grafana Terrakube workspace
# (terraform/grafana/alerting.tf). Every alerts/*.yaml here joins one rule group named
# "frp-client" in the Alerts folder; the rule fields are Grafana's file-provisioning format.
rules:
  # The edge's Prometheus agent remote-writes through the FRP tunnel (remote port 9091), so
  # its series stop arriving when the edge box is down or the tunnel is broken, which is
  # also when every public host behind it stops answering.
  - uid: edge-metrics-missing
    title: Edge Metrics Missing
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: absent_over_time(up{job="aws-edge-node"}[5m])
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 0
                type: gt
    noDataState: OK
    execErrState: OK
    for: 5m
    annotations:
      summary: No metrics from the edge for 10 minutes
      description: Nothing has been remote-written by the edge's Prometheus agent for 10 minutes, so the NixOS edge (nixos/edge) is down or the FRP tunnel is broken, and auth, headscale, gotify and the other public hosts are probably unreachable. Check the frpc pod logs in frp-client, then just edge-ssh systemctl --failed (or the OVH KVM console if the tailnet is down too).
    labels:
      severity: critical
  # comin switches the edge to every merge but never reboots it, so a new kernel or systemd
  # waits for someone to reboot. comin's exporter is scraped by the edge's Prometheus agent
  # (nixos/edge/monitoring.nix, job aws-edge-comin).
  - uid: edge-needs-reboot
    title: Edge Needs Reboot
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: max(comin_need_to_reboot{job="aws-edge-comin"})
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 0
                type: gt
    noDataState: OK
    execErrState: OK
    for: 6h
    annotations:
      summary: The edge has been running an outdated kernel or systemd for 6 hours
      description: comin deployed a configuration that only takes full effect after a reboot (a new kernel, initrd or systemd). Reboot it at a quiet time with just edge-ssh systemctl reboot; the public hosts and the tailnet relay are down for about a minute.
    labels:
      severity: warning
