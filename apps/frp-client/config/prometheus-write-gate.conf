# nginx for prometheus-write-gate (prometheus-write-gate.yaml): POST /api/v1/write to
# Prometheus, /health for the probes, 403 for everything else.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    location = /api/v1/write {
      limit_except POST { deny all; }
      client_max_body_size 16m;
      proxy_pass http://prometheus.prometheus.svc.cluster.local:9090;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
    location = /health {
      return 200 "ok\n";
    }
    location / {
      return 403;
    }
  }
}
