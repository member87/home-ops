---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frpc-config
  namespace: frp-client
data:
  frpc.toml: |
    # frp client configuration
    serverAddr = "140.238.67.83"
    serverPort = 7000

    # Authentication token (must match server)
    auth.method = "token"
    auth.tokenSource.type = "file"
    auth.tokenSource.file.path = "/etc/frp/secrets/auth_token"

    # Pocket ID tunnel - routes through Traefik for CrowdSec protection
    [[proxies]]
    name = "pocket-id"
    type = "tcp"
    localIP = "traefik.traefik.svc.cluster.local"
    localPort = 80
    remotePort = 8081

    # Headscale tunnel
    [[proxies]]
    name = "headscale"
    type = "tcp"
    localIP = "headscale.headscale.svc.cluster.local"
    localPort = 8080
    remotePort = 8082

    # Headscale embedded STUN (UDP) — the embedded DERP region advertises STUN
    # at 140.238.67.83:3478. Without it clients cannot discover their public
    # endpoint, every connection falls back to DERP relaying through this VPS,
    # and streamed media (e.g. Jellyfin to remote/TV clients) stutters.
    [[proxies]]
    name = "headscale-stun"
    localPort = 3479
    localIP = "headscale.headscale.svc.cluster.local"
    remotePort = 3478

    # Dawarich tunnel - routes through Traefik for CrowdSec protection
    [[proxies]]
    name = "dawarich"
    type = "tcp"
    localIP = "traefik.traefik.svc.cluster.local"
    localPort = 80
    remotePort = 8083
