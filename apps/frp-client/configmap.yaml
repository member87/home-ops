---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frpc-config
  namespace: frp-client
data:
  frpc.toml: |
    # frp client configuration
    serverAddr = "18.171.34.111"
    serverPort = 7000

    # Authentication token (must match server)
    auth.method = "token"
    auth.tokenSource.type = "file"
    auth.tokenSource.file.path = "/etc/frp/secrets/auth_token"

    # Pocket ID tunnel - routes through Traefik for CrowdSec protection
    [[proxies]]
    name = "pocket-id"
    type = "tcp"
    localIP = "traefik.traefik.svc.cluster.local"
    localPort = 80
    remotePort = 8081

    # Headscale tunnel
    [[proxies]]
    name = "headscale"
    type = "tcp"
    localIP = "headscale.headscale.svc.cluster.local"
    localPort = 8080
    remotePort = 8082

    # STUN for the embedded DERP region. Public 3478/udp on both edges
    # forwards to the headscale Service (port 3478), whose targetPort maps
    # to the coturn sidecar on pod port 3479 (derper's 3478 socket is dead).
    [[proxies]]
    name = "headscale-stun"
    type = "udp"
    localIP = "headscale.headscale.svc.cluster.local"
    localPort = 3478
    remotePort = 3478

    # Dawarich tunnel - routes through Traefik for CrowdSec protection
    [[proxies]]
    name = "dawarich"
    type = "tcp"
    localIP = "traefik.traefik.svc.cluster.local"
    localPort = 80
    remotePort = 8083
