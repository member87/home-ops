server:
  # The config is a ConfigMap from Git; the web UI editor (unauthenticated, no ForwardAuth on
  # glance.lab) would only offer edits that cannot persist.
  allow-editing: false

pages:
  - name: Home

    columns:
      - size: small
        widgets:
          - type: calendar

          - type: weather
            location: London, United Kingdom
            units: metric

          - type: change-detection
            instance-url: https://changes.lab.jackhumes.com
            token: ${CHANGE_DETECTION_TOKEN}
            collapse-after: 5

      - size: full
        widgets:
          - type: monitor
            cache: 1m
            title: Home
            sites:
              - title: Home Assistant
                url: https://home.lab.jackhumes.com
                icon: sh:home-assistant
              - title: NAS
                url: https://nas.lab.jackhumes.com
                icon: sh:ugreen-nas
              - title: Change Detection
                url: https://changes.lab.jackhumes.com
                icon: sh:changedetection
                alt-status-codes:
                  - 401
              - title: Karakeep
                url: https://karakeep.lab.jackhumes.com
                check-url: https://karakeep.lab.jackhumes.com/api/health
                icon: sh:karakeep
              - title: Gotify
                url: https://gotify.jackhumes.com
                icon: sh:gotify
              # Parked at replicas: 0 until the nodes get more RAM - re-enable with the app.
              # - title: Trek
              #   url: https://trek.lab.jackhumes.com
              #   icon: sh:trek

          - type: monitor
            cache: 1m
            title: Watch & Read
            sites:
              - title: Jellyfin
                url: https://jellyfin.lab.jackhumes.com
                icon: sh:jellyfin
              - title: Jellyseerr
                url: https://jellyseerr.lab.jackhumes.com
                icon: sh:jellyseerr
              - title: Immich
                url: https://immich.lab.jackhumes.com
                icon: sh:immich
              - title: Audiobookshelf
                url: https://audiobookshelf.lab.jackhumes.com
                icon: sh:audiobookshelf
              - title: Shelfmark
                url: https://shelfmark.lab.jackhumes.com
                icon: sh:bookstack
              # Parked at replicas: 0 until the nodes get more RAM - re-enable with the app.
              # - title: EPG (IPTV Guide)
              #   url: https://epg.lab.jackhumes.com/guide.xml
              #   icon: sh:satellite

          - type: monitor
            cache: 1m
            title: Downloads
            sites:
              - title: Sonarr
                url: https://sonarr.lab.jackhumes.com
                icon: sh:sonarr
              - title: Radarr
                url: https://radarr.lab.jackhumes.com
                icon: sh:radarr
              - title: Prowlarr
                url: https://prowlarr.lab.jackhumes.com
                icon: sh:prowlarr
              - title: Profilarr
                url: https://profilarr.lab.jackhumes.com
                icon: sh:profilarr
              - title: Bazarr
                url: https://bazarr.lab.jackhumes.com
                icon: sh:bazarr
              - title: qBittorrent
                url: https://qbittorrent.lab.jackhumes.com
                icon: sh:qbittorrent
              - title: Qui (qBittorrent UI)
                url: https://qui.lab.jackhumes.com
                icon: sh:qui
              - title: SABnzbd
                url: https://sabnzbd.lab.jackhumes.com
                icon: sh:sabnzbd

          - type: hacker-news
            limit: 15
            collapse-after: 5

      - size: small
        widgets:
          - type: clock
            hour-format: 24h

          - type: custom-api
            title: London Transport Status
            cache: 15m
            template: |
              <div class="flex flex-column gap-5">
                {{ with .Options.lines }}
                  {{ range . }}
                    {{ with newRequest (printf "https://api.tfl.gov.uk/line/%s/status" .) | withHeader "User-Agent" "Glance-Dashboard/1.0" | getResponse }}
                      {{ if eq .Response.StatusCode 200 }}
                        {{ range .JSON.Array "" }}{{ template "line" . }}{{ end }}
                      {{ end }}
                    {{ end }}
                  {{ end }}
                {{ else }}
                  {{ with newRequest "https://api.tfl.gov.uk/line/mode/dlr/status" | withHeader "User-Agent" "Glance-Dashboard/1.0" | getResponse }}
                    {{ if eq .Response.StatusCode 200 }}{{ range .JSON.Array "" }}{{ template "line" . }}{{ end }}{{ end }}
                  {{ end }}
                  {{ with newRequest "https://api.tfl.gov.uk/line/mode/tube/status" | withHeader "User-Agent" "Glance-Dashboard/1.0" | getResponse }}
                    {{ if eq .Response.StatusCode 200 }}{{ range .JSON.Array "" }}{{ template "line" . }}{{ end }}{{ end }}
                  {{ end }}
                  {{ with newRequest "https://api.tfl.gov.uk/line/mode/elizabeth-line/status" | withHeader "User-Agent" "Glance-Dashboard/1.0" | getResponse }}
                    {{ if eq .Response.StatusCode 200 }}{{ range .JSON.Array "" }}{{ template "line" . }}{{ end }}{{ end }}
                  {{ end }}
                  {{ with newRequest "https://api.tfl.gov.uk/line/mode/overground/status" | withHeader "User-Agent" "Glance-Dashboard/1.0" | getResponse }}
                    {{ if eq .Response.StatusCode 200 }}{{ range .JSON.Array "" }}{{ template "line" . }}{{ end }}{{ end }}
                  {{ end }}
                {{ end }}
              </div>

                {{ define "line" }}
                {{ $id := .String "id" }}{{ $status := (index (.Array "lineStatuses") 0).String "statusSeverityDescription" }}
                <div class="flex justify-between items-center" style="padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
                  <div class="flex items-center gap-10">
                    <div style="width: 20px; height: 4px; border-radius: 2px; background-color: {{ if eq $id "bakerloo" }}#B36305{{ else if eq $id "dlr" }}#01a7a2{{ else if eq $id "central" }}#E32017{{ else if eq $id "circle" }}#FFD300{{ else if eq $id "district" }}#00782A{{ else if eq $id "hammersmith-city" }}#F3A9BB{{ else if eq $id "jubilee" }}#A0A5A9{{ else if eq $id "metropolitan" }}#9B0056{{ else if eq $id "northern" }}#000000{{ else if eq $id "piccadilly" }}#003688{{ else if eq $id "victoria" }}#0098D4{{ else if eq $id "waterloo-city" }}#95CDBA{{ else if eq $id "elizabeth" }}#7156A5{{ else if eq $id "lioness" }}#E9B908{{ else if eq $id "mildmay" }}#0019A8{{ else if eq $id "windrush" }}#D05F0E{{ else if eq $id "weaver" }}#8F9499{{ else if eq $id "suffragette" }}#64A334{{ else if eq $id "liberty" }}#B05F8C{{ else }}#666{{ end }};"></div>
                    <span class="size-h4">{{ .String "name" }}</span>
                  </div>
                  <div class="text-right">
                    <span class="size-h5 {{ if eq $status "Good Service" }}color-positive{{ else if eq $status "Minor Delays" }}color-primary{{ else }}color-negative{{ end }}">{{ $status }}</span>
                  </div>
                </div>
                {{ end }}

  - name: Lab

    columns:
      - size: full
        widgets:
          - type: monitor
            cache: 1m
            title: Network & Access
            sites:
              - title: Pi-hole
                url: https://pihole.lab.jackhumes.com/admin
                icon: sh:pi-hole
                alt-status-codes:
                  - 401
              - title: Pocket ID
                url: https://auth.jackhumes.com
                icon: sh:pocket-id
              - title: LLDAP
                url: https://lldap.lab.jackhumes.com
                icon: sh:lldap-light
                alt-status-codes:
                  - 401
              - title: Headscale
                url: https://headscale.lab.jackhumes.com/health
                icon: sh:headscale
              - title: Headplane
                url: https://headplane.lab.jackhumes.com
                icon: sh:headscale
              - title: Exit Nodes
                url: https://exit-nodes.lab.jackhumes.com
                icon: sh:tailscale
                alt-status-codes:
                  - 401
              - title: IP Checker
                url: https://ip-checker.lab.jackhumes.com
                icon: sh:speedtest-light

          - type: monitor
            cache: 1m
            title: Cluster & Ops
            sites:
              - title: Flux
                url: https://flux.lab.jackhumes.com
                icon: di:flux-cd
              - title: Longhorn
                url: https://longhorn.lab.jackhumes.com
                icon: sh:rancher-longhorn
              - title: K9s
                url: https://k9s.lab.jackhumes.com
                icon: sh:kubernetes
                alt-status-codes:
                  - 401
              - title: Terrakube
                url: https://terrakube.lab.jackhumes.com
                icon: sh:opentofu
              - title: Jevil
                url: https://jevil.lab.jackhumes.com
                icon: https://jevil.lab.jackhumes.com/jevil.svg
              - title: Nix Cache
                url: https://nix-cache.lab.jackhumes.com/jackhumes/nix-cache-info
                icon: sh:nixos
              - title: Selenium
                url: https://selenium.lab.jackhumes.com
                icon: di:selenium
                alt-status-codes:
                  - 401
              - title: Docs
                url: https://docs.lab.jackhumes.com
                icon: mdi:book-open-variant
              # Parked at replicas: 0, replaced by the Flux Web UI - re-enable with the app.
              # - title: Radar
              #   url: https://radar.lab.jackhumes.com
              #   icon: sh:kubernetes
              #   alt-status-codes:
              #     - 401

          - type: monitor
            cache: 1m
            title: Observability
            sites:
              - title: Grafana
                url: https://grafana.lab.jackhumes.com
                icon: sh:grafana
                alt-status-codes:
                  - 401
              - title: Prometheus
                url: https://prometheus.lab.jackhumes.com
                icon: sh:prometheus
                alt-status-codes:
                  - 401

      - size: small
        widgets:
          - type: repository
            repository: member87/home-ops
            pull-requests-limit: 5
            issues-limit: 3
            commits-limit: 3

          - type: custom-api
            title: Exit Nodes
            cache: 30s
            url: http://tailscale-exit-node-manager-api.tailscale-exit-node-manager.svc.cluster.local:8080/api/stats
            template: |
              <div class="flex flex-column gap-10">
                <div class="flex justify-between items-center">
                  <span>Running</span>
                  <span class="size-h3 {{ if gt (.JSON.Int "running_count") 0 }}color-positive{{ end }}">{{ .JSON.Int "running_count" }} / {{ .JSON.Int "total_countries" }}</span>
                </div>
                <div class="flex justify-between items-center">
                  <span>VPN slots</span>
                  <span class="size-h4">{{ .JSON.Int "slots_used" }} / {{ .JSON.Int "slots_total" }}</span>
                </div>
                <div class="flex justify-between items-center">
                  <span>Tailnet devices online</span>
                  <span class="size-h4">{{ .JSON.Int "tailnet_devices_online" }} / {{ .JSON.Int "tailnet_devices_total" }}</span>
                </div>
                {{ if gt (.JSON.Int "error_count") 0 }}
                <div class="flex justify-between items-center">
                  <span>Errors</span>
                  <span class="size-h4 color-negative">{{ .JSON.Int "error_count" }}</span>
                </div>
                {{ end }}
              </div>

theme:
  background-color: 240 15 10
  primary-color: 220 15 85
  contrast-multiplier: 1.2
