---
# Gotify: browsers and the Android app arrive through Traefik; Grafana posts alerts to the
# Service directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gotify
  namespace: gotify
spec:
  podSelector:
    matchLabels:
      app: gotify
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana
          podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 8080
---
# Alert images: anyone may read through Traefik, only Grafana may upload.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-images
  namespace: gotify
spec:
  podSelector:
    matchLabels:
      app: alert-images
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app: traefik
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana
          podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 8081
