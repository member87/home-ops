---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: gotify-secrets
  namespace: gotify
spec:
  encryptedData:
    # Client secret of the "Gotify" OIDC client in Pocket ID (restricted to the admin group).
    GOTIFY_OIDC_CLIENTSECRET: 
  template:
    metadata:
      name: gotify-secrets
      namespace: gotify
    type: Opaque
