---
apiVersion: v1
kind: Service
metadata:
  name: gotify
  namespace: gotify
  labels:
    app: gotify
spec:
  selector:
    app: gotify
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Public, read-only: Traefik serves gotify.jackhumes.com/alert-images/ from this port.
apiVersion: v1
kind: Service
metadata:
  name: alert-images
  namespace: gotify
  labels:
    app: alert-images
spec:
  selector:
    app: alert-images
  ports:
    - name: http
      port: 80
      targetPort: http
---
# WebDAV upload endpoint for Grafana's external image storage. Not routed by Traefik; the
# NetworkPolicy only lets the Grafana pods reach it.
apiVersion: v1
kind: Service
metadata:
  name: alert-images-upload
  namespace: gotify
  labels:
    app: alert-images
spec:
  selector:
    app: alert-images
  ports:
    - name: upload
      port: 80
      targetPort: upload
