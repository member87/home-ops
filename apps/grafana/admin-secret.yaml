---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin-secret
  namespace: grafana
spec:
  encryptedData:
    # Grafana admin password. Used only by terraform/grafana to authenticate the
    # Grafana provider over API basic auth; humans sign in through Pocket ID.
    admin_password: 
  template:
    metadata:
      name: grafana-admin-secret
      namespace: grafana
    type: Opaque
