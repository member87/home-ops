---
# One-off: removes everything file provisioning created, so terraform/grafana (which now owns
# alerting) can create the same rules, contact point, template and policy over the API.
# Grafana refuses API writes to file-provisioned objects and does not drop them when their
# file disappears, hence the explicit deletes. Remove this ConfigMap once it has run.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: grafana
data:
  unprovision.yaml: |
    apiVersion: 1
    resetPolicies:
      - 1
    deleteTemplates:
      - orgId: 1
        name: discord
    deleteContactPoints:
      - orgId: 1
        uid: discord-webhook
    deleteRules:
      - orgId: 1
        uid: pod-not-ready
      - orgId: 1
        uid: network-errors-high
      - orgId: 1
        uid: network-packet-drop-high
      - orgId: 1
        uid: tcp-retransmit-high
      - orgId: 1
        uid: crowdsec-ban-activity
      - orgId: 1
        uid: pod-cpu-throttling
      - orgId: 1
        uid: pod-memory-near-limit
      - orgId: 1
        uid: pod-oom-killed
      - orgId: 1
        uid: persistent-volume-full
      - orgId: 1
        uid: persistent-volume-critical
      - orgId: 1
        uid: node-memory-high
      - orgId: 1
        uid: node-not-ready
      - orgId: 1
        uid: node-cpu-high
      - orgId: 1
        uid: node-disk-high
      - orgId: 1
        uid: pod-restart-high
      - orgId: 1
        uid: node-temp-high
      - orgId: 1
        uid: immich-backup-stale
      - orgId: 1
        uid: nix-cache-build-stale
      - orgId: 1
        uid: nix-cache-build-failed
      - orgId: 1
        uid: jevil-merging-halted
      - orgId: 1
        uid: jevil-hygiene-problem
      - orgId: 1
        uid: longhorn-backup-stale
      - orgId: 1
        uid: etcd-snapshot-stale
