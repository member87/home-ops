---
# Grafana's PostgreSQL password. Previously the literal string "grafana", committed in
# plaintext in configmap.yaml; rotated to a value that has never been in git.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-db-secret
  namespace: grafana
spec:
  encryptedData:
    GF_DATABASE_PASSWORD: 
  template:
    metadata:
      name: grafana-db-secret
      namespace: grafana
    type: Opaque
