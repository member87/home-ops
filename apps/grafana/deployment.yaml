---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: grafana
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      # Grafana runs as uid 472 and installs its datasource plugins into
      # /var/lib/grafana/plugins at startup. fsGroup makes the emptyDir group-owned by
      # 472 so that write succeeds; without it every plugin install dies with
      # "permission denied, make sure you have write access to plugin dir" and the Loki
      # datasource silently never registers. No init container is needed - Grafana
      # creates the directories itself once the volume is writable.
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      # One replica per node, so a single node loss never takes out both. The surge
      # pod lands on the third node during a rollout.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: grafana
              topologyKey: kubernetes.io/hostname
      containers:
        - name: grafana
          image: grafana/grafana:13.3.1
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 9094
              name: alerting-ha
              protocol: TCP
            - containerPort: 9094
              name: alerting-ha-udp
              protocol: UDP
          env:
            - name: GF_PATHS_CONFIG
              value: /etc/grafana/grafana.ini
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            # Grafana 13 stopped bundling the Loki datasource: the image ships only
            # prometheus, tempo, zipkin, opentsdb, stackdriver and pyroscope in
            # data/plugins-bundled. Without this, the provisioned Loki datasource
            # resolves to "Data source not found" and every logs panel returns No data.
            # Deliberately unversioned: the catalog serves the build that matches this
            # Grafana, so a pin here would break on the next image bump instead.
            - name: GF_PLUGINS_PREINSTALL
              value: loki
            # Both replicas evaluate every rule; gossiping their notification log over the
            # grafana-alerting-ha Service is what stops each one sending its own copy.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GF_UNIFIED_ALERTING_HA_PEERS
              value: grafana-alerting-ha.grafana.svc.cluster.local:9094
            - name: GF_UNIFIED_ALERTING_HA_LISTEN_ADDRESS
              value: $(POD_IP):9094
            - name: GF_UNIFIED_ALERTING_HA_ADVERTISE_ADDRESS
              value: $(POD_IP):9094
            # Alert notifications attach a screenshot of the rule's panel on the Alert Rules
            # dashboard, rendered by grafana-image-renderer (renderer.yaml).
            - name: GF_UNIFIED_ALERTING_SCREENSHOTS_CAPTURE
              value: "true"
            # A panel screenshot loads the whole Grafana frontend in Chromium: ~10s in
            # this cluster, right at the 10s default, so most captures 408'd. 30s is the max.
            - name: GF_UNIFIED_ALERTING_SCREENSHOTS_CAPTURE_TIMEOUT
              value: 30s
            - name: GF_RENDERING_SERVER_URL
              value: http://grafana-image-renderer.grafana.svc.cluster.local:8081/render
            - name: GF_RENDERING_CALLBACK_URL
              value: http://grafana.grafana.svc.cluster.local:3000/
            - name: GF_RENDERING_RENDERER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-renderer-secret
                  key: token
            # Screenshots are uploaded to the alert image store in apps/gotify and sent as a
            # public URL (gotify.jackhumes.com/alert-images/<random>.png), which the Gotify
            # app can load away from home and Discord embeds, instead of as an attachment.
            - name: GF_UNIFIED_ALERTING_SCREENSHOTS_UPLOAD_EXTERNAL_IMAGE_STORAGE
              value: "true"
            - name: GF_EXTERNAL_IMAGE_STORAGE_PROVIDER
              value: webdav
            - name: GF_EXTERNAL_IMAGE_STORAGE_WEBDAV_URL
              value: http://alert-images-upload.gotify.svc.cluster.local
            - name: GF_EXTERNAL_IMAGE_STORAGE_WEBDAV_PUBLIC_URL
              value: https://gotify.jackhumes.com/alert-images/{{file}}
            # Dashboards are applied over the HTTP API by terraform/grafana. Grafana
            # cannot provision a service account token declaratively, so the admin
            # user authenticates the provider over API basic auth instead; the login
            # form stays disabled and humans still sign in through Pocket ID.
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-secret
                  key: admin_password
            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-db-secret
                  key: GF_DATABASE_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /etc/grafana
            - name: oidc-secret
              mountPath: /etc/secrets
              readOnly: true
            - name: storage
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          # Idle Grafana sits at 300-450Mi; loading a large dashboard pushed it past the
          # old 512Mi limit (OOMKilled), and CPU throttling at 500m made /api/health miss
          # the liveness timeout, so both replicas restarted at once and the site 502'd.
          # Request what it actually uses; leave headroom for dashboard query bursts.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: grafana-config
        - name: oidc-secret
          secret:
            secretName: grafana-oidc-secret
        - name: storage
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-datasources
