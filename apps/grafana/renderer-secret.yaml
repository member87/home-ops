---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-renderer-secret
  namespace: grafana
spec:
  encryptedData:
    # Shared token between Grafana (GF_RENDERING_RENDERER_TOKEN) and grafana-image-renderer
    # (AUTH_TOKEN): the renderer refuses requests without it.
    token: 
  template:
    metadata:
      name: grafana-renderer-secret
      namespace: grafana
    type: Opaque
