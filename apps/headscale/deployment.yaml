---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: headscale
spec:
  # Single replica on an RWO Longhorn PVC: RollingUpdate deadlocks on
 # Multi-Attach when the new pod lands on another node. Recreate releases
 # the volume first (same pattern as tailscale-dns).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"   # metrics_listen_addr in config/config.yaml
    spec:
      # Keep the tailnet control plane off talos-t8o-8d5 (8GiB, ~80% of memory
      # requested). When the other nodes drained for a reboot its MemAvailable fell
      # to ~5%: global reclaim evicted headscale's pages (100+ major faults/s in this
      # container, at ~35MiB of its 256Mi limit), the process stalled for minutes
      # and the liveness probe restarted it 4 times, dropping every client's map
      # stream. Either 39GiB node can take it; the Longhorn volume attaches anywhere.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - talos-t8o-8d5
      containers:
        - name: headscale
          image: headscale/headscale:v0.29.5
          args:
            - serve
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
            - containerPort: 50443
              name: grpc
          env:
            - name: TZ
              value: UTC
          volumeMounts:
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
            - name: data
              mountPath: /var/lib/headscale
            - name: oidc-secret
              mountPath: /etc/headscale/secrets
              readOnly: true
          # /health pings SQLite with its own 1s timeout, so 5s lets a slow ping
          # answer 500 instead of timing the probe out. Readiness takes the pod out
          # of the Service after 15s of failures; liveness only restarts after ~60s,
          # since a restart drops every node's long-poll and cannot fix a stall.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: data
          persistentVolumeClaim:
            claimName: headscale-data
        - name: oidc-secret
          secret:
            secretName: headscale-oidc-secret
