---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: headscale-oidc-secret
  namespace: headscale
spec:
  encryptedData:
    # Pocket ID OIDC client secret for Headscale
    client_secret: 
  template:
    metadata:
      name: headscale-oidc-secret
      namespace: headscale
    type: Opaque
---
# The edge's public IPv4 for the embedded DERP region (derp.server.ipv4 in config.yaml),
# read by Headscale as HEADSCALE_DERP_SERVER_IPV4. Sealed so the repo does not publish it.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: headscale-edge-secret
  namespace: headscale
spec:
  encryptedData:
    HEADSCALE_DERP_SERVER_IPV4: 
  template:
    metadata:
      name: headscale-edge-secret
      namespace: headscale
    type: Opaque
