apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: headscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
      annotations:
        headscale-config-checksum: {{ .Files.Get "configmap.yaml" | sha256sum | quote }}
    spec:
      containers:
        - name: headscale
          image: headscale/headscale:v0.29.3
          args:
            - serve
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
            - containerPort: 50443
              name: grpc
          env:
            - name: TZ
              value: UTC
          volumeMounts:
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
            - name: data
              mountPath: /var/lib/headscale
            - name: oidc-secret
              mountPath: /etc/headscale/secrets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

        # headscale v0.29's embedded derper STUN logs "stun server started"
        # but never answers binding requests (verified in-cluster, pod-IP
        # direct). coturn serves STUN on the same port; the Service's
        # `stun` targetPort and the frp udp proxy keep working unchanged.
        - name: stun
          image: coturn/coturn:4.6.3
          args:
            - -n
            - --stun-only
            - --no-cli
            - --no-tls
            - --no-dtls
            - --listening-port=3478
          ports:
            - containerPort: 3478
              name: stun
              protocol: UDP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: data
          persistentVolumeClaim:
            claimName: headscale-data
        - name: oidc-secret
          secret:
            secretName: headscale-oidc-secret
