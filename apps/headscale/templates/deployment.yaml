apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: headscale
spec:
  # Single replica on an RWO Longhorn PVC: RollingUpdate deadlocks on
 # Multi-Attach when the new pod lands on another node. Recreate releases
 # the volume first (same pattern as tailscale-dns).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
      annotations:
        headscale-config-checksum: {{ .Files.Get "configmap.yaml" | sha256sum | quote }}
    spec:
      containers:
        - name: headscale
          image: headscale/headscale:v0.29.3
          args:
            - serve
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
            - containerPort: 50443
              name: grpc
          env:
            - name: TZ
              value: UTC
          volumeMounts:
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
            - name: data
              mountPath: /var/lib/headscale
            - name: oidc-secret
              mountPath: /etc/headscale/secrets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

        # headscale v0.29's embedded derper STUN logs "stun server started"
        # but never answers binding requests (verified pod-IP direct), and it
        # cannot be disabled (empty stun_listen_addr falls back to :3478).
        # derper keeps dead-binding 3478; coturn answers on 3479 and the
        # Service/frp proxy remap public 3478 -> 3479.
        - name: stun
          image: coturn/coturn:4.6.3
          args:
            - -n
            - --stun-only
            - --no-cli
            - --no-tls
            - --no-dtls
            - --listening-port=3479
          ports:
            - containerPort: 3479
              name: stun
              protocol: UDP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: data
          persistentVolumeClaim:
            claimName: headscale-data
        - name: oidc-secret
          secret:
            secretName: headscale-oidc-secret
