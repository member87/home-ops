---
# Backblaze application key "immich-backup-metrics": listBuckets and listFiles on bucket
# jackhumes-immich-backup only. It can list file versions and sizes but cannot read,
# write, hide or delete anything.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: immich-backup-exporter-secret
  namespace: immich
spec:
  encryptedData:
    B2_APPLICATION_KEY_ID: 
    B2_APPLICATION_KEY: 
  template:
    metadata:
      name: immich-backup-exporter-secret
      namespace: immich
    type: Opaque
