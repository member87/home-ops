---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The immich namespace and the immich-library PVC belong to the immich HelmRelease.
resources:
  - sealedsecret.yaml
  - cronjob.yaml
  - exporter-sealedsecret.yaml
  - exporter-deployment.yaml
# Generated so an exporter.py change gets a new name and rolls the Deployment.
configMapGenerator:
  - name: immich-backup-exporter
    namespace: immich
    files:
      - exporter.py
