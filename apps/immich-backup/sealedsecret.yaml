---
# Backblaze application key "immich-backup": listBuckets, listFiles, readFiles, writeFiles
# on bucket jackhumes-immich-backup only. No deleteFiles, so a leaked key can hide or
# overwrite files but every prior version survives until the bucket lifecycle rules expire it.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: immich-backup-secret
  namespace: immich
spec:
  encryptedData:
    RCLONE_CONFIG_B2_ACCOUNT: 
    RCLONE_CONFIG_B2_KEY: 
  template:
    metadata:
      name: immich-backup-secret
      namespace: immich
    type: Opaque
