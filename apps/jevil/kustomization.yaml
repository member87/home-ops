---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - sealedsecret.yaml
  - deployment.yaml
# Generated so a policy change gets a new name and rolls the pod onto it.
configMapGenerator:
  - name: jevil-config
    namespace: jevil
    files:
      - policy.json
