---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jevil
  namespace: jevil
---
# Read-only: Jevil maps changed files onto the Kustomizations and Git-sourced HelmReleases that
# deploy them, and checks they are Ready on the merge commit afterwards. It never writes to the
# cluster; Flux deploys what it merges.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jevil-read-flux
  namespace: flux-system
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jevil-read-flux
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jevil-read-flux
subjects:
  - kind: ServiceAccount
    name: jevil
    namespace: jevil
---
# Cluster health for the merge gate and tuppr progress: nodes, Longhorn volumes, and tuppr's
# upgrade requests. Read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jevil-read-health
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["tuppr.home-operations.com"]
    resources: ["talosupgrades", "kubernetesupgrades"]
    verbs: ["get", "list"]
  # The validate check reads each CRD's schema, so custom resources are checked against what
  # this cluster's API server accepts.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jevil-read-health
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jevil-read-health
subjects:
  - kind: ServiceAccount
    name: jevil
    namespace: jevil
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jevil-read-volumes
  namespace: longhorn-system
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jevil-read-volumes
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jevil-read-volumes
subjects:
  - kind: ServiceAccount
    name: jevil
    namespace: jevil
