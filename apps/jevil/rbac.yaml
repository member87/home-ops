---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jevil
  namespace: jevil
---
# Read-only: Jevil checks a Kustomization is Ready before merging into it and Ready on the
# merge commit afterwards. It never writes to the cluster; Flux deploys what it merges.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jevil-read-kustomizations
  namespace: flux-system
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jevil-read-kustomizations
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jevil-read-kustomizations
subjects:
  - kind: ServiceAccount
    name: jevil
    namespace: jevil
