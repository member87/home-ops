---
# Pulls the private ghcr.io/member87/jevil image. Same credential as
# tailscale-exit-node-manager-ghcr-pull, resealed for this namespace.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jevil-ghcr-pull
  namespace: jevil
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: jevil-ghcr-pull
      namespace: jevil
    type: kubernetes.io/dockerconfigjson
