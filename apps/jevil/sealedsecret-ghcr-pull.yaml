---
# Pulls the private ghcr.io/member87/jevil image: a classic token of member87 with only
# read:packages (shared with tailscale-exit-node-manager-ghcr-pull).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jevil-ghcr-pull
  namespace: jevil
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: jevil-ghcr-pull
      namespace: jevil
    type: kubernetes.io/dockerconfigjson
