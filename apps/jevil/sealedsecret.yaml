---
# openrouter-api-key: Jev is called through OpenRouter's System One API (typesafe/jev-1.14),
#   billed per input token; cap it with a credit limit under openrouter.ai/settings/keys.
# private-key.pem, app-id: the "Jevil Bot" GitHub App (commits and labels as jevil-bot[bot]).
#   A leaked key can merge to member87/home-ops: revoke it under App settings -> Private keys.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jevil-secrets
  namespace: jevil
spec:
  encryptedData:
    app-id: 
    openrouter-api-key: 
    private-key.pem: 
  template:
    metadata:
      name: jevil-secrets
      namespace: jevil
