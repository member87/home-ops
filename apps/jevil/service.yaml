---
# Jevil's dashboard, /metrics and /healthz, all on the one port.
apiVersion: v1
kind: Service
metadata:
  name: jevil
  namespace: jevil
  labels:
    app: jevil
spec:
  selector:
    app: jevil
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
