---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent   # bound PVC specs are immutable; create-only
  name: karakeep-data
  namespace: karakeep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# Search index only: rebuilt from karakeep-data with Admin settings -> Reindex all bookmarks.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent   # bound PVC specs are immutable; create-only
  name: karakeep-meilisearch
  namespace: karakeep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
