---
apiVersion: v1
kind: Service
metadata:
  name: karakeep
  namespace: karakeep
  labels:
    app: karakeep
spec:
  selector:
    app: karakeep
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep-chrome
  namespace: karakeep
  labels:
    app: karakeep-chrome
spec:
  selector:
    app: karakeep-chrome
  ports:
    - name: devtools
      port: 9222
      targetPort: 9222
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep-meilisearch
  namespace: karakeep
  labels:
    app: karakeep-meilisearch
spec:
  selector:
    app: karakeep-meilisearch
  ports:
    - name: http
      port: 7700
      targetPort: 7700
      protocol: TCP
  type: ClusterIP
