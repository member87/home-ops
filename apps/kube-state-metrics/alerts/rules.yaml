# Grafana alert rules for kube-state-metrics, applied by the grafana Terrakube workspace
# (terraform/grafana/alerting.tf). Every alerts/*.yaml here joins one rule group named
# "kube-state-metrics" in the Alerts folder; the rule fields are Grafana's file-provisioning format.
rules:
  - uid: pod-not-ready
    title: Pod Not Ready
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 120
          to: 0
        datasourceUid: prometheus
        model:
          expr: kube_pod_status_phase{phase=~"Pending|Failed|Unknown"} * on(namespace,pod,uid) group_left(owner_kind) kube_pod_owner{owner_kind!="Job"} > 0
          refId: A
      - refId: B
        relativeTimeRange:
          from: 120
          to: 0
        datasourceUid: __expr__
        model:
          conditions:
            - evaluator:
                params:
                  - 0
                type: gt
              operator:
                type: and
              query:
                params:
                  - A
              reducer:
                params: []
                type: last
              type: query
          datasource:
            type: __expr__
            uid: __expr__
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 120
          to: 0
        datasourceUid: __expr__
        model:
          conditions:
            - evaluator:
                params:
                  - 0
                type: gt
              operator:
                type: and
              query:
                params:
                  - C
              reducer:
                params: []
                type: last
              type: query
          datasource:
            type: __expr__
            uid: __expr__
          expression: B
          refId: C
          type: threshold
    noDataState: OK
    execErrState: OK
    for: 10m
    annotations:
      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready
      description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in {{ $labels.phase }} phase for more than 10 minutes. This alert excludes Jobs and only fires on sustained non-ready states.
    labels:
      severity: warning

  - uid: pod-cpu-throttling
    title: Pod CPU Throttling
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: sum by (namespace,pod,container,instance,node) (rate(container_cpu_cfs_throttled_seconds_total{namespace!~"podinfo|node-exporter",container!="",image!=""}[5m])) * on(namespace,pod) group_left() max by (namespace,pod) (kube_pod_status_phase{phase="Running"} == 1)
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 0.2
                type: gt
    noDataState: OK
    execErrState: OK
    for: 10m
    annotations:
      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} experiencing CPU throttling
      description: Running container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} is sustaining high CPU throttling (more than 0.2s/s) for 10 minutes. Consider increasing CPU limits.
    labels:
      severity: warning

  - uid: pod-memory-near-limit
    title: Pod Memory Near Limit
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: (container_memory_working_set_bytes / container_spec_memory_limit_bytes) * 100 > 90 < Inf
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 90
                type: gt
    noDataState: OK
    execErrState: OK
    for: 5m
    annotations:
      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} memory usage near limit
      description: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} is using {{ $value }}% of its memory limit. Risk of OOM kill.
    labels:
      severity: warning

  - uid: pod-oom-killed
    title: Pod OOM Killed
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: kube_pod_container_status_terminated_reason{reason="OOMKilled"} > 0
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 0
                type: gt
    noDataState: OK
    execErrState: OK
    for: 1m
    annotations:
      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} was OOM killed
      description: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} was killed due to Out Of Memory. Increase memory limits.
    labels:
      severity: critical

  - uid: pod-restart-high
    title: Pod Restarting Frequently
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: (rate(kube_pod_container_status_restarts_total{namespace!="longhorn-system"}[15m]) * 3600) * on(namespace,pod) group_left(owner_kind) kube_pod_owner{owner_kind!="Job"} > 5
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 5
                type: gt
    noDataState: OK
    execErrState: OK
    for: 5m
    annotations:
      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting frequently
      description: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} (excluding Job pods) is restarting more than 5 times per hour
    labels:
      severity: critical

  - uid: persistent-volume-full
    title: Persistent Volume Nearly Full
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 85
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 85
                type: gt
    noDataState: OK
    execErrState: OK
    for: 5m
    annotations:
      summary: PersistentVolume {{ $labels.persistentvolumeclaim }} is nearly full
      description: PersistentVolume {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is {{ $value }}% full
    labels:
      severity: warning

  - uid: persistent-volume-critical
    title: Persistent Volume Critically Full
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 95
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 95
                type: gt
    noDataState: OK
    execErrState: OK
    for: 10m
    annotations:
      summary: PersistentVolume {{ $labels.persistentvolumeclaim }} is critically full
      description: PersistentVolume {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is above 95% usage (current value {{ $value }}%)
    labels:
      severity: critical

  - uid: node-not-ready
    title: Node Not Ready
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 0
                type: eq
    noDataState: OK
    execErrState: OK
    for: 10m
    annotations:
      summary: Node {{ $labels.node }} is not ready
      description: Kubernetes node {{ $labels.node }} has reported NotReady for more than 10 minutes.
    labels:
      severity: critical
