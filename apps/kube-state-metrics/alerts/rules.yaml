# Grafana alert rules for kube-state-metrics, applied by the grafana Terrakube workspace
# (terraform/grafana/alerting.tf). Every alerts/*.yaml here joins one rule group named
# "kube-state-metrics" in the Alerts folder; the rule fields are Grafana's file-provisioning format.
rules:
  - uid: pod-not-ready
    title: Pod Not Ready
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 120
          to: 0
        datasourceUid: prometheus
        model:
          expr: kube_pod_status_phase{phase=~"Pending|Failed|Unknown"} * on(namespace,pod,uid) group_left(owner_kind) kube_pod_owner{owner_kind!="Job"} > 0
          refId: A
      - refId: B
        relativeTimeRange:
          from: 120
          to: 0
        datasourceUid: __expr__
        model:
          conditions:
            - evaluator:
                params:
                  - 0
                type: gt
              operator:
                type: and
              query:
                params:
                  - A
              reducer:
                params: []
                type: last
              type: query
          datasource:
            type: __expr__
            uid: __expr__
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 120
          to: 0
        datasourceUid: __expr__
        model:
          conditions:
            - evaluator:
                params:
                  - 0
                type: gt
              operator:
                type: and
              query:
                params:
                  - C
              reducer:
                params: []
                type: last
              type: query
          datasource:
            type: __expr__
            uid: __expr__
          expression: B
          refId: C
          type: threshold
    noDataState: OK
    execErrState: OK
    for: 10m
    annotations:
      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready
      description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in {{ $labels.phase }} phase for more than 10 minutes. This alert excludes Jobs and only fires on sustained non-ready states.
    labels:
      severity: warning

  - uid: pod-cpu-throttling
    title: Pod CPU Throttling
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: sum by (namespace,pod,container,instance,node) (rate(container_cpu_cfs_throttled_seconds_total{namespace!~"podinfo|node-exporter",container!="",image!=""}[5m])) * on(namespace,pod) group_left() max by (namespace,pod) (kube_pod_status_phase{phase="Running"} == 1)
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 0.2
                type: gt
    noDataState: OK
    execErrState: OK
    for: 10m
    annotations:
      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} experiencing CPU throttling
      description: Running container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} is sustaining high CPU throttling (more than 0.2s/s) for 10 minutes. Consider increasing CPU limits.
    labels:
      severity: warning

  - uid: pod-memory-near-limit
    title: Pod Memory Near Limit
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: (container_memory_working_set_bytes / container_spec_memory_limit_bytes) * 100 > 90 < Inf
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 90
                type: gt
    noDataState: OK
    execErrState: OK
    for: 5m
    annotations:
      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} memory usage near limit
      description: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} is using {{ printf "%.1f" $values.B.Value }}% of its memory limit. Risk of OOM kill.
    labels:
      severity: warning

  - uid: pod-oom-killed
    title: Pod OOM Killed
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: kube_pod_container_status_terminated_reason{reason="OOMKilled"} > 0
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 0
                type: gt
    noDataState: OK
    execErrState: OK
    for: 1m
    annotations:
      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} was OOM killed
      description: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} was killed due to Out Of Memory. Increase memory limits.
    labels:
      severity: critical

  - uid: pod-restart-high
    title: Pod Restarting Frequently
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: (rate(kube_pod_container_status_restarts_total{namespace!="longhorn-system"}[15m]) * 3600) * on(namespace,pod) group_left(owner_kind) kube_pod_owner{owner_kind!="Job"} > 5
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 5
                type: gt
    noDataState: OK
    execErrState: OK
    for: 5m
    annotations:
      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting frequently
      description: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} (excluding Job pods) is restarting more than 5 times per hour
    labels:
      severity: critical

  - uid: persistent-volume-full
    title: Persistent Volume Nearly Full
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 85
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 85
                type: gt
    noDataState: OK
    execErrState: OK
    for: 5m
    annotations:
      summary: PersistentVolume {{ $labels.persistentvolumeclaim }} is nearly full
      description: PersistentVolume {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is {{ printf "%.1f" $values.B.Value }}% full
    labels:
      severity: warning

  - uid: persistent-volume-critical
    title: Persistent Volume Critically Full
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 95
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 95
                type: gt
    noDataState: OK
    execErrState: OK
    for: 10m
    annotations:
      summary: PersistentVolume {{ $labels.persistentvolumeclaim }} is critically full
      description: PersistentVolume {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is above 95% usage (current value {{ printf "%.1f" $values.B.Value }}%)
    labels:
      severity: critical

  - uid: node-not-ready
    title: Node Not Ready
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 0
                type: eq
    noDataState: OK
    execErrState: OK
    for: 10m
    annotations:
      summary: Node {{ $labels.node }} is not ready
      description: Kubernetes node {{ $labels.node }} has reported NotReady for more than 10 minutes.
    labels:
      severity: critical

  # Every other rule in this group reads kube-state-metrics and treats no data as OK, so
  # without this one they all go quiet together when it is down.
  - uid: kube-state-metrics-down
    title: Kube State Metrics Down
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: absent(up{job="kube-state-metrics"} == 1)
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 0
                type: gt
    noDataState: OK
    execErrState: OK
    for: 5m
    annotations:
      summary: kube-state-metrics is not being scraped
      description: Prometheus has had no successful kube-state-metrics scrape for 5 minutes. Node Not Ready, Pod Not Ready, Pod Restarting Frequently, Workload Unavailable, Immich Backup Stale and Nix Cache Build Stale all read it and stay silent until it is back. Check the kube-state-metrics pod in its namespace.
    labels:
      severity: critical

  # Catches pods that are Running but not Ready, which Pod Not Ready (Pending/Failed/Unknown
  # phases only) misses. Rollouts, drains and qbittorrent's 30m shutdown leave a workload
  # short for up to ~25 minutes, hence the 30m hold.
  - uid: workload-unavailable
    title: Workload Unavailable
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: >-
            max by (namespace, workload) (
            label_replace(kube_deployment_status_replicas_unavailable, "workload", "Deployment/$1", "deployment", "(.+)")
            or label_replace(kube_statefulset_replicas - kube_statefulset_status_replicas_ready, "workload", "StatefulSet/$1", "statefulset", "(.+)")
            or label_replace(kube_daemonset_status_number_unavailable, "workload", "DaemonSet/$1", "daemonset", "(.+)")
            ) > 0
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 0
                type: gt
    noDataState: OK
    execErrState: OK
    for: 30m
    annotations:
      summary: '{{ $labels.namespace }}/{{ $labels.workload }} is missing replicas'
      description: '{{ $labels.namespace }}/{{ $labels.workload }} has had {{ printf "%.0f" $values.B.Value }} replica(s) unavailable or not Ready for 30 minutes. Check its pods with kubectl describe and their readiness probe and logs.'
    labels:
      severity: warning
