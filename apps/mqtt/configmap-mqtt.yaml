---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-config
  namespace: mqtt
data:
  mosquitto.conf: |
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout

    allow_anonymous false
    password_file /mosquitto/config/passwd
    acl_file /mosquitto/config/acl

    listener 1883 0.0.0.0

  acl: |
    user homeassistant
    topic readwrite #

    user zigbee2mqtt
    topic readwrite zigbee2mqtt/#
    topic readwrite homeassistant/#
