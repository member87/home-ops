# Grafana alert rules for nix-cache, applied by the grafana Terrakube workspace
# (terraform/grafana/alerting.tf). Every alerts/*.yaml here joins one rule group named
# "nix-cache" in the Alerts folder; the rule fields are Grafana's file-provisioning format.
rules:
  - uid: nix-cache-build-stale
    title: Nix Cache Build Stale
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        # Falls back to the CronJob creation time so a builder that has never
        # succeeded still alerts.
        model:
          expr: time() - (kube_cronjob_status_last_successful_time{namespace="nix-cache",cronjob="nix-cache-builder"} or kube_cronjob_created{namespace="nix-cache",cronjob="nix-cache-builder"})
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 108000
                type: gt
    noDataState: OK
    execErrState: OK
    for: 10m
    annotations:
      summary: The nightly NixOS build has not succeeded for 30 hours
      description: CronJob nix-cache/nix-cache-builder last succeeded {{ humanizeDuration $values.B.Value }} ago. The desktops keep upgrading to the last pushed flake.lock, so they are not getting updates; the Nix Cache dashboard shows the failed phase and the job's logs.
    labels:
      severity: warning

  - uid: nix-cache-build-failed
    title: Nix Cache Build Failed
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        # The exporter only publishes this series while the last builder run
        # failed, so the alert resolves on the next successful run.
        model:
          expr: max by (phase) (nix_cache_build_failed_phase{kubernetes_namespace="nix-cache"})
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 0
                type: gt
    noDataState: OK
    execErrState: OK
    for: 0s
    annotations:
      summary: The nightly NixOS build failed during {{ $labels.phase }}
      description: The last nix-cache/nix-cache-builder run failed in its {{ $labels.phase }} phase, so flake.lock was not pushed and the desktops will not get updates until a run succeeds. The Nix Cache dashboard shows which targets failed; check the job's logs, or rerun with kubectl -n nix-cache create job --from=cronjob/nix-cache-builder nix-cache-builder-manual.
    labels:
      severity: critical
