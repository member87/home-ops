---
# Nightly NixOS build (builder/run.sh): update the flake, build every host, push the outputs
# to Attic, then push flake.lock to member87/nixos main. Done before the desktops' 05:00
# auto-upgrade. Run one now with:
#   kubectl -n nix-cache create job --from=cronjob/nix-cache-builder nix-cache-builder-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nix-cache-builder
  namespace: nix-cache
spec:
  schedule: "0 1 * * *"
  timeZone: Europe/London
  # The store image takes one writer: two VMs mounting it would corrupt it.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # Ends a run before the desktops upgrade. A run cut off here loses nothing: the store
      # keeps what it built, and the next night carries on from there.
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app: nix-cache-builder
        spec:
          restartPolicy: Never
          # The Nix sandbox and the loop mount need privilege; under kata it stops at the
          # pod's own VM, with no host device or node filesystem in reach.
          runtimeClassName: kata
          automountServiceAccountToken: false
          enableServiceLinks: false
          # t8o has 8GiB; a build VM there would starve it.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values: ["talos-t8o-8d5"]
          containers:
            - name: builder
              image: nixos/nix:2.35.4
              imagePullPolicy: IfNotPresent
              command: ["bash", "/config/run.sh"]
              securityContext:
                privileged: true
              # Kata sizes the VM from the limits: 5 vCPUs, and 16GiB for evaluation plus two
              # parallel builds of three cores each (builder/nix.conf). 12GiB was not enough:
              # clang compiling ghostty's glslang was OOM-killed beside another build.
              resources:
                requests:
                  cpu: "1"
                  memory: 6Gi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "5"
                  memory: 16Gi
                  ephemeral-storage: 5Gi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: config
                  mountPath: /etc/nix/nix.conf
                  subPath: nix.conf
                  readOnly: true
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
                - name: nas
                  mountPath: /nas
                  subPath: nix-cache/builder
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: nix-cache-builder
            - name: secrets
              secret:
                secretName: nix-cache-builder-secret
                defaultMode: 0400
            - name: nas
              persistentVolumeClaim:
                claimName: nix-cache-nas
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
