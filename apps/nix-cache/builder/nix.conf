# Builder's /etc/nix/nix.conf (builder-cronjob.yaml). Substituters match what the desktops
# use, so whatever the builder downloads instead of building is what they download too.
experimental-features = nix-command flakes
build-users-group = nixbld
sandbox = true
# Fail instead of quietly building without the sandbox.
sandbox-fallback = false
# Build directories on the persistent store image, not the node's disk.
build-dir = /nix/var/nix/builds
# Flush a path's contents before registering it, so a VM killed mid-run cannot leave a
# valid-looking empty file behind (run.sh verifies the store after such a run anyway).
fsync-store-paths = true
max-jobs = 2
cores = 3
substituters = https://cache.nixos.org https://nix-community.cachix.org https://hyprland.cachix.org https://nix-citizen.cachix.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= nix-citizen.cachix.org-1:lPMkWc2X8XD4/7YPEEwXKKBg+SVbYTVrAaLA2wQTKCo=
connect-timeout = 10
fallback = true
accept-flake-config = false
warn-dirty = false
log-lines = 200
# Collect garbage mid-build when the store image runs low: start under 20 GiB free, stop
# at 40 GiB.
min-free = 21474836480
max-free = 42949672960
# `nix flake update` resolves every github: input through api.github.com, which allows 60
# unauthenticated requests an hour per IP, shared with the whole home network. A
# nix-access-tokens key in nix-cache-builder-secret ("access-tokens = github.com=<token>",
# a fine-grained token with read-only access to public repositories) lifts that to 5000.
# Without it this line is skipped.
!include /secrets/nix-access-tokens
