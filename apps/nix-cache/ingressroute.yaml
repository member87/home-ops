---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nix-cache-cert
  namespace: nix-cache
spec:
  secretName: nix-cache-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - nix-cache.lab.jackhumes.com
---
# jevil:auth Nix substituters cannot follow a ForwardAuth login. The jackhumes cache is
# public by design (LAN-only host, read-only without a token); pushing needs Attic's token.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nix-cache
  namespace: nix-cache
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nix-cache.lab.jackhumes.com`)
      kind: Rule
      services:
        - name: attic
          port: 8080
  tls:
    secretName: nix-cache-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nix-cache-http
  namespace: nix-cache
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`nix-cache.lab.jackhumes.com`)
      kind: Rule
      services:
        - name: attic
          port: 8080
      middlewares:
        - name: redirect-https
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: nix-cache
spec:
  redirectScheme:
    scheme: https
    permanent: true
