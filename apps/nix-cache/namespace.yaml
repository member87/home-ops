---
# Nix binary cache for the NixOS desktops (github.com/member87/nixos): Attic serves what
# cache.nixos.org and the other public caches do not have, and a nightly CronJob updates
# the flake, builds every host, pushes the result and then the new flake.lock.
# Privileged because the builder needs the Nix sandbox and a loop mount; it runs under
# RuntimeClass kata, so that privilege stops at the pod's own VM. Attic itself is not
# privileged.
apiVersion: v1
kind: Namespace
metadata:
  name: nix-cache
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
