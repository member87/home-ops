---
# Attic's JWT signing key (RS256) and the seed database: the jackhumes cache with its
# Nix signing key, created once with atticadm/attic outside the cluster so the public
# key could go into the NixOS config before the first deploy. The seed is copied onto
# the empty database volume only (attic-deployment.yaml); it holds no store paths.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: nix-cache-attic-secret
  namespace: nix-cache
spec:
  encryptedData:
    ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64: 
    server.db: 
  template:
    metadata:
      name: nix-cache-attic-secret
      namespace: nix-cache
---
# Builder credentials: an Attic token that can only pull and push the jackhumes cache,
# and a write deploy key on member87/nixos for pushing the updated flake.lock.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: nix-cache-builder-secret
  namespace: nix-cache
spec:
  encryptedData:
    attic-token: 
    deploy-key: 
  template:
    metadata:
      name: nix-cache-builder-secret
      namespace: nix-cache
