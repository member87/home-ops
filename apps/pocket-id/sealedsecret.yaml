---
# SealedSecret for Pocket ID
# Contains encryption key and PostgreSQL connection string
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pocket-id-secrets
  namespace: pocket-id
spec:
  encryptedData:
    # Encryption key for Pocket ID (32 bytes, base64). Protects kv.jwt_private_key.json
    # only; OIDC client secrets are hashed and passkeys are public keys, so rotating
    # this costs a fresh signing key and one re-login, nothing more.
    ENCRYPTION_KEY: 
    # PostgreSQL connection string for the pocketid role. The password is rotated and
    # deliberately not written here: a comment is as public as the value it describes.
    DB_CONNECTION_STRING: 
  template:
    metadata:
      name: pocket-id-secrets
      namespace: pocket-id
    type: Opaque
