---
# Passwords for the per-application roles created by the init script. These used to be
# literals inside configmap.yaml; both have been rotated to values never committed.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgresql-app-passwords
  namespace: postgresql
spec:
  encryptedData:
    POCKETID_PASSWORD: 
  template:
    metadata:
      name: postgresql-app-passwords
      namespace: postgresql
    type: Opaque
