---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent   # bound PVC specs are immutable;
    # Flux inherited spec.volumeName from Helm's last-applied on some of these, and a
    # server-side apply that omits it then tries to clear it. Create-only avoids that.
  name: profilarr-config
  namespace: profilarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profilarr
  namespace: profilarr
  labels:
    app: profilarr
spec:
  replicas: 1
  # Single replica on RWO volume(s): a RollingUpdate deadlocks on Multi-Attach when the
  # replacement pod schedules on another node. Recreate releases the volume first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: profilarr
  template:
    metadata:
      labels:
        app: profilarr
    spec:
      containers:
        - name: profilarr
          # v2 ships only to GHCR (tags without a `v` prefix); Docker Hub
          # santiagosayshey/profilarr stays on the v1 line.
          image: ghcr.io/dictionarry-hub/profilarr:2.3.1
          ports:
            - containerPort: 6868
              name: http
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/London"
            - name: UMASK
              value: "022"
            - name: PORT
              value: "6868"
            - name: HOST
              value: "0.0.0.0"
            - name: ORIGIN
              value: "https://profilarr.lab.jackhumes.com"
            - name: APP_BASE_PATH
              value: "/config"
            # Login on; SSO turns on because all three OIDC_* values are set. With SSO
            # configured first-run password setup stays closed. Pocket ID restricts the
            # client to the `admin` group and redirects to ORIGIN/auth/oidc/callback.
            - name: AUTH
              value: "on"
            - name: OIDC_DISCOVERY_URL
              value: "https://auth.jackhumes.com/.well-known/openid-configuration"
            - name: OIDC_CLIENT_ID
              value: "723c331c-a283-48d2-acc3-0317d7b39a45"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: profilarr-secrets
                  key: OIDC_CLIENT_SECRET
          volumeMounts:
            - name: config
              mountPath: /config
              # v2 cannot read v1 data and both use /config/backups, so v2 lives in
              # its own subdirectory; v1's files stay untouched at the volume root.
              subPath: v2
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: profilarr-config
