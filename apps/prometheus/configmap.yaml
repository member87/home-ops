---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'home-ops'
        monitor: 'prometheus'

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
        # Store only metrics something reads; every job below aliases this list. A metric
        # not matched is dropped at scrape time and never written (89% of scraped series
        # were unread, mostly kube-apiserver and etcd-client histograms). The readers are the
        # dashboards in terraform/grafana/dashboards, the alert rules in
        # apps/grafana/alerting.yaml, Radar (workload metrics, rightsizing, PVC usage) and
        # scripts/talos-sync.sh. A dashboard or alert that needs a metric missing here gets
        # no data: add the name in the same PR. Histograms are listed as one entry with
        # _(bucket|count|sum). up and scrape_* are generated by Prometheus and always kept.
        metric_relabel_configs: &keep_used_metrics
          - source_labels: [__name__]
            action: keep
            regex: "\
              alloy_build_info|\
              alloy_component_controller_running_components|\
