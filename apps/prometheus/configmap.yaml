      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
        metric_relabel_configs: *keep_used_metrics

      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true  # Required for Talos Linux - kubelet certs don't have IP SANs
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
        metric_relabel_configs: *keep_used_metrics

      - job_name: 'kubernetes-cadvisor'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true  # Required for Talos Linux - kubelet certs don't have IP SANs
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - source_labels: [__meta_kubernetes_node_name]
            action: replace
            target_label: node
          - target_label: __metrics_path__
            replacement: /metrics/cadvisor
        metric_relabel_configs: *keep_used_metrics

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # MetalLB >= 0.16 serves metrics over HTTPS with token auth; scraped by the
          # metallb job below, which can set TLS and the bearer token.
          - source_labels: [__meta_kubernetes_namespace]
            action: drop
            regex: metallb-system
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
        metric_relabel_configs: *keep_used_metrics

      - job_name: 'metallb'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [metallb-system]
        scheme: https
        tls_config:
          insecure_skip_verify: true  # self-signed serving cert generated by MetalLB
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metricshttps
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
        metric_relabel_configs: *keep_used_metrics

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.kube-state-metrics.svc.cluster.local:8080']
        metric_relabel_configs: *keep_used_metrics

      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoints_name]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            action: replace
            target_label: instance
        metric_relabel_configs: *keep_used_metrics

      - job_name: 'pocket-id'
        static_configs:
          - targets: ['pocket-id.pocket-id.svc.cluster.local:9464']
        metrics_path: /metrics
        metric_relabel_configs: *keep_used_metrics

      # Components whose pod templates come from upstream (Helm charts, Talos, vendored
      # manifests), so they cannot carry prometheus.io annotations. Each job selects
      # the pods by namespace and named container port.
      - job_name: 'longhorn'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [longhorn-system]
        relabel_configs:
          # One longhorn-manager per node; each reports the volumes, replicas and
          # disks of its own node.
          - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: longhorn-manager;manager
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
        metric_relabel_configs: *keep_used_metrics

      - job_name: 'coredns'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kube-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_k8s_app, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: kube-dns;metrics
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
        metric_relabel_configs: *keep_used_metrics

      - job_name: 'sealed-secrets'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [sealed-secrets]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
        metric_relabel_configs: *keep_used_metrics

      # Terrakube's MinIO holds the Terraform state. MinIO serves these without a
      # bearer token in this install (MINIO_PROMETHEUS_AUTH_TYPE=public).
      - job_name: 'terrakube-minio'
        metrics_path: /minio/v2/metrics/cluster
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [terrakube]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: minio;api
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
        metric_relabel_configs: *keep_used_metrics

      - job_name: 'terrakube-dex'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [terrakube]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: dex;telemetry
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
        metric_relabel_configs: *keep_used_metrics

      # Immich serves two OTEL metrics endpoints from the server container
      # (IMMICH_TELEMETRY_INCLUDE=all in flux/helm/immich): 8081 for the API worker and
      # 8082 for the microservices (job) worker. The chart's own metrics switch would
      # also create ServiceMonitors, whose CRD this cluster does not have, so the ports
      # are not declared on the pod and these jobs rewrite the address instead.
      - job_name: 'immich-api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [immich]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: server;http
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8081
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
        metric_relabel_configs: *keep_used_metrics

      - job_name: 'immich-microservices'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [immich]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: server;http
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8082
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
        metric_relabel_configs: *keep_used_metrics
