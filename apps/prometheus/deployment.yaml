---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: prometheus
spec:
  replicas: 1
  # Single replica on RWO volume(s): a RollingUpdate deadlocks on Multi-Attach when the
  # replacement pod schedules on another node. Recreate releases the volume first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
            - '--web.enable-lifecycle'
            # Nothing restarts Prometheus when the ConfigMap changes; reload it when the
            # mounted file changes instead (checked every 30s).
            - '--config.auto-reload'
            # Receives the edge-local Prometheus agent through the private FRP tunnel.
            - '--web.enable-remote-write-receiver'
            # 90 days of history (right-sizing reads 14). With the keep-list the blocks grow
            # ~0.25 GB a day, so 90 days is ~22 GB, plus ~2 GB while compaction rewrites a
            # 9-day block; the size cap stays as a backstop against an exporter flooding the
            # 40Gi volume. Raising either needs the volume to grow first (see pvc.yaml).
            - '--storage.tsdb.retention.time=90d'
            - '--storage.tsdb.retention.size=32GB'
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 90
            timeoutSeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 45
            timeoutSeconds: 5
            periodSeconds: 5
          # ~290k head series already held it at 1.8-1.95Gi against the old 2Gi limit;
          # the request now matches real usage so the scheduler counts it.
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 3Gi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          persistentVolumeClaim:
            claimName: prometheus-storage
