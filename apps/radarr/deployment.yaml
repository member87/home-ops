---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent   # bound PVC specs are immutable;
    # Flux inherited spec.volumeName from Helm's last-applied on some of these, and a
    # server-side apply that omits it then tries to clear it. Create-only avoids that.
  name: radarr-config
  namespace: radarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
# The whole /volume1/kubernetes export, mounted once at /data: downloads land in
# /data/downloads (remote path mapping /downloads/ -> /data/downloads/ for SABnzbd and
# qBittorrent) and the library is /data/media/movies. Hardlinks only work within one
# mount, so two PVs (media, downloads) made every import a full copy over NFS.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: radarr-data-pv
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-manual
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=3
    - proto=tcp
    - hard
    - nointr
  nfs:
    server: 10.0.0.9
    path: /volume1/kubernetes
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent   # bound PVC specs are immutable
  name: radarr-data
  namespace: radarr
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-manual
  volumeName: radarr-data-pv
  resources:
    requests:
      storage: 1Ti
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: radarr
  labels:
    app: radarr
spec:
  replicas: 1
  # Single replica on RWO volume(s): a RollingUpdate deadlocks on Multi-Attach when the
  # replacement pod schedules on another node. Recreate releases the volume first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: radarr
          image: ghcr.io/home-operations/radarr:7.1.0
          ports:
            - containerPort: 7878
              name: http
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/London"
            
            # ============================================
            # Radarr Application Configuration
            # Format: RADARR__SECTION__KEY
            # ============================================
            
            # Server Configuration
            - name: RADARR__SERVER__PORT
              value: "7878"
            - name: RADARR__SERVER__BINDADDRESS
              value: "*"
            - name: RADARR__SERVER__URLBASE
              value: ""
            
            # Authentication - Using External (Tinyauth ForwardAuth)
            - name: RADARR__AUTH__METHOD
              value: "External"
            - name: RADARR__AUTH__REQUIRED
              value: "DisabledForLocalAddresses"
            
            # API Key from sealed secret
            - name: RADARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: radarr-secrets
                  key: api-key
            
            # Logging Configuration
            - name: RADARR__LOG__LEVEL
              value: "info"
            - name: RADARR__LOG__CONSOLEFORMAT
              value: "Standard"
            - name: RADARR__LOG__ANALYTICSENABLED
              value: "false"
            - name: RADARR__LOG__DBENABLED
              value: "true"
            
            # Update Configuration (Docker-managed)
            - name: RADARR__UPDATE__BRANCH
              value: "master"
            - name: RADARR__UPDATE__MECHANISM
              value: "Docker"
            
            # Application Settings
            - name: RADARR__APP__INSTANCENAME
              value: "Radarr"
            - name: RADARR__APP__THEME
              value: "auto"
            - name: RADARR__APP__LAUNCHBROWSER
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /ping
              port: 7878
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 7878
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "368Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        # Shared NFSv3 storage from UGREEN NAS at 10.0.0.9 (see radarr-data-pv)
        - name: data
          persistentVolumeClaim:
            claimName: radarr-data
