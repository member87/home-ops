---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: selenium-cert
  namespace: selenium
spec:
  secretName: selenium-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - selenium.lab.jackhumes.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: selenium
  namespace: selenium
spec:
  entryPoints:
    - websecure
  routes:
    # Grid console only: / redirects to /ui/, which reads /graphql. The WebDriver
    # API (/wd/hub, /session) stays cluster-internal, so a Tiny Auth login cannot
    # drive the browser.
    - match: Host(`selenium.lab.jackhumes.com`) && (Path(`/`) || PathPrefix(`/ui`) || Path(`/graphql`))
      kind: Rule
      middlewares:
        - name: tinyauth-forwardauth
      services:
        - name: selenium
          port: 4444
  tls:
    secretName: selenium-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: selenium-http
  namespace: selenium
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`selenium.lab.jackhumes.com`)
      kind: Rule
      services:
        - name: selenium
          port: 4444
      middlewares:
        - name: redirect-https
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: selenium
spec:
  redirectScheme:
    scheme: https
    permanent: true
