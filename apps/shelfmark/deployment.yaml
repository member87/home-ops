---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent   # bound PVC specs are immutable;
    # Flux inherited spec.volumeName from Helm's last-applied on some of these, and a
    # server-side apply that omits it then tries to clear it. Create-only avoids that.
  name: shelfmark-config
  namespace: shelfmark
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shelfmark-books-pv
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-manual
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=3
    - proto=tcp
    - hard
    - nointr
  nfs:
    server: 10.0.0.9
    path: /volume1/kubernetes/downloads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent   # bound PVC specs are immutable;
    # Flux inherited spec.volumeName from Helm's last-applied on some of these, and a
    # server-side apply that omits it then tries to clear it. Create-only avoids that.
  name: shelfmark-books
  namespace: shelfmark
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-manual
  volumeName: shelfmark-books-pv
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shelfmark-media-pv
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-manual
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=3
    - proto=tcp
    - hard
    - nointr
  nfs:
    server: 10.0.0.9
    path: /volume1/kubernetes/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent   # bound PVC specs are immutable
  name: shelfmark-media
  namespace: shelfmark
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-manual
  volumeName: shelfmark-media-pv
  resources:
    requests:
      storage: 1Ti
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfmark
  namespace: shelfmark
  labels:
    app: shelfmark
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shelfmark
  template:
    metadata:
      labels:
        app: shelfmark
    spec:
      containers:
        - name: shelfmark
          image: ghcr.io/calibrain/shelfmark:v1.7.0
          ports:
            - containerPort: 8084
              name: http
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/London"
            - name: FLASK_PORT
              value: "8084"
            - name: DOCKERMODE
              value: "true"
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: INGEST_DIR
              value: "/books"
            # Audiobooks go straight into the Audiobookshelf library (/media/audiobooks
            # there), one Author/Title folder each. ENV values override Shelfmark's UI.
            - name: DESTINATION_AUDIOBOOK
              value: "/audiobooks"
            - name: FILE_ORGANIZATION_AUDIOBOOK
              value: "organize"
            - name: TEMPLATE_AUDIOBOOK_ORGANIZE
              value: "{Author}/{Title}/{Title}"
            # downloads and media are separate NFS exports, so a hardlink is impossible
            - name: HARDLINK_TORRENTS_AUDIOBOOK
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: books
              mountPath: /books
            - name: books
              mountPath: /downloads
            - name: media
              mountPath: /audiobooks
              subPath: audiobooks
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: shelfmark-config
        - name: books
          persistentVolumeClaim:
            claimName: shelfmark-books
        - name: media
          persistentVolumeClaim:
            claimName: shelfmark-media
