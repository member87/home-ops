---
# ActiveStorage uploads (statements, imports, logos), shared by the web and worker containers of
# the one sure pod: the worker reads the files the web container stores.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent   # bound PVC specs are immutable; create-only
  name: sure-storage
  namespace: sure
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent   # bound PVC specs are immutable; create-only
  name: sure-postgres
  namespace: sure
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
