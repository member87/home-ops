---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-exit-node-manager-config
  namespace: tailscale-exit-node-manager
data:
  HEADSCALE_USER_ID: "9" # `exit-nodes` Headscale user, created via `headscale users create exit-nodes`
  VPN_KEY_POOL_SIZE: "3"
  HEADSCALE_LB_IP: "10.0.0.200" # Traefik LoadBalancer IP; gluetun's DNS_UPSTREAM_PLAIN_ADDRESSES is buggy (falls back to public DoT), so exit-node pods use a hostAliases /etc/hosts entry instead
  countries.json: |
    [
      {"code":"NL","name":"Netherlands","gluetun_country":"Netherlands"},
      {"code":"US","name":"United States","gluetun_country":"United States"},
      {"code":"GB","name":"United Kingdom","gluetun_country":"United Kingdom"},
      {"code":"DE","name":"Germany","gluetun_country":"Germany"},
      {"code":"JP","name":"Japan","gluetun_country":"Japan"},
      {"code":"CH","name":"Switzerland","gluetun_country":"Switzerland"},
      {"code":"SE","name":"Sweden","gluetun_country":"Sweden"},
      {"code":"CA","name":"Canada","gluetun_country":"Canada"}
    ]
