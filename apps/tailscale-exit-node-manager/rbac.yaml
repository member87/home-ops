---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exit-node-manager-api
  namespace: tailscale-exit-node-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: exit-node-manager-api
  namespace: tailscale-exit-node-manager
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "create", "patch"]
  # Exit-node container log viewer in the dashboard (GET /api/nodes/{code}/logs).
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Client attribution: Headscale cannot say which peer picked which exit node,
  # so the API execs `tailscale status --json` inside the exit-node pod.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: exit-node-manager-api
  namespace: tailscale-exit-node-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: exit-node-manager-api
subjects:
  - kind: ServiceAccount
    name: exit-node-manager-api
    namespace: tailscale-exit-node-manager
