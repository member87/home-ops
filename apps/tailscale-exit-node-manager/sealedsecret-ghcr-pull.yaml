---
# Pulls the private ghcr.io/member87/tailscale-exit-node-manager-* images: a classic token of
# member87 with only read:packages (shared with jevil-ghcr-pull).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tailscale-exit-node-manager-ghcr-pull
  namespace: tailscale-exit-node-manager
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: tailscale-exit-node-manager-ghcr-pull
      namespace: tailscale-exit-node-manager
    type: kubernetes.io/dockerconfigjson
