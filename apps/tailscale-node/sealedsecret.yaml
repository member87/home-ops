---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tailscale-node-auth
  namespace: tailscale-node
spec:
  encryptedData:
    # Reusable Headscale pre-auth key (user jack, expires 2027-11-09). Only used when a node
    # registers for the first time; afterwards each node runs from its state Secret. A new
    # node after the expiry needs a fresh key: headscale preauthkeys create -u 1 --reusable
    TS_AUTHKEY: 
  template:
    metadata:
      name: tailscale-node-auth
      namespace: tailscale-node
    type: Opaque
