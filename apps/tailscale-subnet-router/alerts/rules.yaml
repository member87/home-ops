# Grafana alert rules for tailscale-subnet-router, applied by the grafana Terrakube workspace
# (terraform/grafana/alerting.tf). Every alerts/*.yaml here joins one rule group named
# "tailscale-subnet-router" in the Alerts folder; the rule fields are Grafana's file-provisioning format.
rules:
  # Both series come from the peer-exporter sidecar. The value is the peer's WireGuard
  # traffic in bit/s, kept only while the peer is on a relay: the unless drops it as soon
  # as it has gone direct, and max_over_time bridges short gaps in tailscaled's Active
  # flag. A device that wakes up over the relay and goes idle before a direct path forms
  # (iOS does this all the time) never crosses the threshold, so this fires only for
  # someone actually using the tailnet through the edge's 4mbit egress cap.
  - uid: tailnet-peer-relayed
    title: Tailnet Peer Relayed
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: >-
            8 * sum by (peer, user, os) (
              rate(tailscale_peer_rx_bytes_total[5m]) + rate(tailscale_peer_tx_bytes_total[5m])
            )
            and on (peer)
            (
              max by (peer) (max_over_time(tailscale_peer_active{path!="direct"}[2m]))
              unless on (peer)
              max by (peer) (max_over_time(tailscale_peer_active{path="direct"}[2m]))
            )
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 200000
                type: gt
    noDataState: OK
    execErrState: OK
    for: 5m
    annotations:
      summary: '{{ $labels.peer }} ({{ $labels.user }}, {{ $labels.os }}) has been using the tailnet through the relay for 5 minutes'
      description: '{{ $labels.peer }} is moving {{ humanize $values.B.Value }}bit/s through the AWS edge relay instead of a direct WireGuard path, so it is capped at about 2 Mbit/s. Run tailscale ping {{ $labels.peer }} from the subnet router; docs/tailnet-vpn.md has the next steps.'
    labels:
      severity: warning
      notify: phone
