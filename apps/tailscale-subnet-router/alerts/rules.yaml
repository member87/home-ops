# Grafana alert rules for tailscale-subnet-router, applied by the grafana Terrakube workspace
# (terraform/grafana/alerting.tf). Every alerts/*.yaml here joins one rule group named
# "tailscale-subnet-router" in the Alerts folder; the rule fields are Grafana's file-provisioning format.
rules:
  # tailscale_peer_active comes from the peer-exporter sidecar and lists only peers with
  # recent traffic, so a device counts while it is using home apps, the LAN or the exit
  # node. max_over_time bridges short idle gaps; the unless drops a peer as soon as it has
  # gone direct, so the 5m hold means 5 minutes in use without a direct path.
  - uid: tailnet-peer-relayed
    title: Tailnet Peer Relayed
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: >-
            max by (peer, user, os, path) (max_over_time(tailscale_peer_active{path!="direct"}[2m]))
            unless on (peer)
            max by (peer) (max_over_time(tailscale_peer_active{path="direct"}[2m]))
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 0
                type: gt
    noDataState: OK
    execErrState: OK
    for: 5m
    annotations:
      summary: '{{ $labels.peer }} ({{ $labels.user }}, {{ $labels.os }}) has used the tailnet for 5 minutes without a direct connection'
      description: '{{ $labels.peer }} is reaching the subnet router through {{ $labels.path }}, not a direct WireGuard path, so every byte crosses the AWS edge and its 4mbit egress cap. Usually an outdated client app or a network that blocks UDP. Run tailscale ping {{ $labels.peer }} from a tailnet host to confirm, then update or restart the client; see docs/tailnet-vpn.md.'
    labels:
      severity: warning
