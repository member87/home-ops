---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-subnet-router
  namespace: tailscale-subnet-router
spec:
  replicas: 1
  # Two pods cannot safely use the same Kubernetes-backed Tailscale node state.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tailscale-subnet-router
  template:
    metadata:
      labels:
        app: tailscale-subnet-router
      # peer-exporter: how each active peer reaches this node (direct or relayed).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9186"
        prometheus.io/path: /metrics
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: tailscale
      # One host-network tailscaled per node: two on one host fight over routing table 52.
      # apps/tailscale-node covers every node except this one and tailscale-dns's, so moving
      # this pod means updating that DaemonSet's node list too.
      nodeSelector:
        kubernetes.io/hostname: talos-lox-1n1
      containers:
        # No memory limit on purpose: remote access is infrastructure, so this pod sits in the
        # second Talos OOM tier with traefik instead of dying first with the apps
        # (talos/patches/oom-config.yaml).
        - name: tailscale
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 64Mi
              cpu: 110m
          image: tailscale/tailscale:v1.104.4
          command:
            - /bin/sh
            - -c
            - |
              ln -sf xtables-nft-multi /usr/sbin/iptables
              ln -sf xtables-nft-multi /usr/sbin/iptables-save
              ln -sf xtables-nft-multi /usr/sbin/iptables-restore
              ln -sf xtables-nft-multi /usr/sbin/ip6tables
              ln -sf xtables-nft-multi /usr/sbin/ip6tables-save
              ln -sf xtables-nft-multi /usr/sbin/ip6tables-restore

              for route in 10.0.0.0/24 192.168.1.0/24; do
                iptables -t nat -C POSTROUTING -s 100.64.0.0/10 -d "$route" -j MASQUERADE 2>/dev/null || \
                iptables -t nat -A POSTROUTING -s 100.64.0.0/10 -d "$route" -j MASQUERADE
              done

              # Catch-all MASQUERADE so traffic from clients using this node as an
              # exit node (destinations outside the two LAN subnets above) is NATed
              # out to the internet instead of being silently dropped.
              iptables -t nat -C POSTROUTING -s 100.64.0.0/10 -j MASQUERADE 2>/dev/null || \
              iptables -t nat -A POSTROUTING -s 100.64.0.0/10 -j MASQUERADE
              ip6tables -t nat -C POSTROUTING -s fd7a:115c:a1e0::/48 -j MASQUERADE 2>/dev/null || \
              ip6tables -t nat -A POSTROUTING -s fd7a:115c:a1e0::/48 -j MASQUERADE

              echo "SNAT masquerade configured for Tailscale-to-LAN and exit-node traffic"
              exec /usr/local/bin/containerboot
          ports:
            - name: wireguard
              containerPort: 41641
              hostPort: 41641
              protocol: UDP
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
            - name: TS_HOSTNAME
              value: "k8s-subnet-router"
            - name: TS_ROUTES
              value: "10.0.0.201/32,10.0.0.0/24,192.168.1.0/24"
            - name: TS_STATE_DIR
              value: "/var/lib/tailscale"
            - name: TS_KUBE_SECRET
              value: "tailscale-subnet-router-state"
            - name: TS_USERSPACE
              value: "false"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_EXTRA_ARGS
              value: "--login-server=https://headscale.lab.jackhumes.com --advertise-exit-node"
            # Stable UDP socket for direct peers; the DNS endpoint uses
            # UDP/41642 on a different host-network node.
            - name: TS_TAILSCALED_EXTRA_ARGS
              value: "--port=41641"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            - name: dev-net-tun
              mountPath: /dev/net/tun
            # containerboot puts tailscaled's socket in /tmp; peer-exporter reads it.
            - name: tailscaled-socket
              mountPath: /tmp
        # Exports tailscale_peer_active{path=direct|derp|peer_relay} for the relayed-peer
        # alert in alerts/rules.yaml. hostNetwork: 9186 is bound on the node.
        - name: peer-exporter
          image: python:3.15.2-alpine3.24
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -u
            - -B
            - /scripts/peer-exporter.py
          ports:
            - containerPort: 9186
              name: metrics
              protocol: TCP
          env:
            - name: TAILSCALED_SOCKET
              value: /tmp/tailscaled.sock
            - name: PORT
              value: "9186"
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tailscaled-socket
              mountPath: /tmp
      volumes:
        - name: tailscale-state
          emptyDir: {}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: tailscaled-socket
          emptyDir: {}
        - name: scripts
          configMap:
            name: peer-exporter
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale
  namespace: tailscale-subnet-router
