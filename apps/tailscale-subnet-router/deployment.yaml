---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-subnet-router
  namespace: tailscale-subnet-router
spec:
  replicas: 1
  # Two pods cannot safely use the same Kubernetes-backed Tailscale node state.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tailscale-subnet-router
  template:
    metadata:
      labels:
        app: tailscale-subnet-router
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: tailscale
      # The TUN device is known-good on this node; talos-t8o-8d5 cannot create
      # tailscale0 and leaves the router in CrashLoopBackOff.
      nodeSelector:
        kubernetes.io/hostname: talos-lox-1n1
      initContainers:
        # Advertises <home WAN IPv4>:41641 as a static endpoint. The home router forwards WAN
        # UDP/41641 to this node (10.0.0.21), and it is the only way in for peers behind
        # per-destination NAT (mobile carriers): the router's own mapping for this socket uses a
        # random port and drops packets from any address/port it has not sent to. STUN never
        # reports the forwarded port, so this sidecar follows the WAN IP (the ISP rotates it)
        # and reloads tailscaled's config file live; no restart. See docs/tailnet-vpn.md.
        - name: wan-endpoint
          image: tailscale/tailscale:v1.104.2
          restartPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              cfg=/etc/tailscaled/cap-148.hujson
              sock=/var/run/tailscale/tailscaled.sock
              port=41641
              # tailscaled 1.104 crashes at boot on an empty StaticEndpoints list, so the key is
              # written only once an endpoint is known (hujson allows the trailing comma).
              write_config() {
                eps=""
                if [ -n "${1:-}" ]; then eps="\"StaticEndpoints\": [\"$1\"],"; fi
                cat > "$cfg.tmp" <<EOF
              {
                "version": "alpha0",
                "ServerURL": "https://headscale.lab.jackhumes.com",
                "AuthKey": "file:/etc/tailscale-auth/TS_AUTHKEY",
                "Hostname": "k8s-subnet-router",
                "acceptDNS": false,
                "acceptRoutes": false,
                "AdvertiseRoutes": ["10.0.0.201/32", "10.0.0.0/24", "192.168.1.0/24"],
                "AdvertiseExitNode": true,
                "NoStatefulFiltering": true,
                $eps
              }
              EOF
                mv "$cfg.tmp" "$cfg"
              }
              [ -f "$cfg" ] || write_config
              advertised=""
              while true; do
                wan=$(tailscale --socket="$sock" netcheck --format=json-line 2>/dev/null \
                  | sed -n 's/.*"GlobalV4":"\([0-9.]*\):[0-9]*".*/\1/p')
                if [ -n "$wan" ] && [ "$wan" != "$advertised" ]; then
                  write_config "$wan:$port"
                  if tailscale --socket="$sock" debug reload-config; then
                    advertised=$wan
                    echo "advertising static endpoint $wan:$port"
                  fi
                fi
                # Retry quickly until tailscaled is up and the first endpoint is advertised.
                if [ -n "$advertised" ]; then sleep 60; else sleep 5; fi
              done
          startupProbe:
            exec:
              command: ["test", "-f", "/etc/tailscaled/cap-148.hujson"]
            periodSeconds: 1
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: tailscaled-config
              mountPath: /etc/tailscaled
            - name: tailscaled-socket
              mountPath: /var/run/tailscale
      containers:
        # No memory limit on purpose: remote access is infrastructure, so this pod sits in the
        # second Talos OOM tier with traefik instead of dying first with the apps
        # (talos/patches/oom-config.yaml).
        - name: tailscale
          image: tailscale/tailscale:v1.104.2
          command:
            - /bin/sh
            - -c
            - |
              ln -sf xtables-nft-multi /usr/sbin/iptables
              ln -sf xtables-nft-multi /usr/sbin/iptables-save
              ln -sf xtables-nft-multi /usr/sbin/iptables-restore
              ln -sf xtables-nft-multi /usr/sbin/ip6tables
              ln -sf xtables-nft-multi /usr/sbin/ip6tables-save
              ln -sf xtables-nft-multi /usr/sbin/ip6tables-restore

              for route in 10.0.0.0/24 192.168.1.0/24; do
                iptables -t nat -C POSTROUTING -s 100.64.0.0/10 -d "$route" -j MASQUERADE 2>/dev/null || \
                iptables -t nat -A POSTROUTING -s 100.64.0.0/10 -d "$route" -j MASQUERADE
              done

              # Catch-all MASQUERADE so traffic from clients using this node as an
              # exit node (destinations outside the two LAN subnets above) is NATed
              # out to the internet instead of being silently dropped.
              iptables -t nat -C POSTROUTING -s 100.64.0.0/10 -j MASQUERADE 2>/dev/null || \
              iptables -t nat -A POSTROUTING -s 100.64.0.0/10 -j MASQUERADE
              ip6tables -t nat -C POSTROUTING -s fd7a:115c:a1e0::/48 -j MASQUERADE 2>/dev/null || \
              ip6tables -t nat -A POSTROUTING -s fd7a:115c:a1e0::/48 -j MASQUERADE

              echo "SNAT masquerade configured for Tailscale-to-LAN and exit-node traffic"
              exec /usr/local/bin/containerboot
          ports:
            - name: wireguard
              containerPort: 41641
              hostPort: 41641
              protocol: UDP
          env:
            # Hostname, routes, exit node, login server and auth key live in the config file
            # written by wan-endpoint; containerboot rejects the equivalent TS_* variables
            # alongside it.
            - name: TS_EXPERIMENTAL_VERSIONED_CONFIG_DIR
              value: "/etc/tailscaled"
            - name: TS_SOCKET
              value: "/var/run/tailscale/tailscaled.sock"
            - name: TS_STATE_DIR
              value: "/var/lib/tailscale"
            - name: TS_KUBE_SECRET
              value: "tailscale-subnet-router-state"
            - name: TS_USERSPACE
              value: "false"
            # Stable UDP socket for direct peers, forwarded from WAN UDP/41641 by the home
            # router; the DNS endpoint uses UDP/41642 on a different host-network node.
            - name: TS_TAILSCALED_EXTRA_ARGS
              value: "--port=41641"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            - name: tailscaled-config
              mountPath: /etc/tailscaled
              readOnly: true
            - name: tailscaled-socket
              mountPath: /var/run/tailscale
            - name: tailscale-auth
              mountPath: /etc/tailscale-auth
              readOnly: true
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: tailscale-state
          emptyDir: {}
        - name: tailscaled-config
          emptyDir: {}
        - name: tailscaled-socket
          emptyDir: {}
        - name: tailscale-auth
          secret:
            secretName: tailscale-auth
            items:
              - key: TS_AUTHKEY
                path: TS_AUTHKEY
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale
  namespace: tailscale-subnet-router
