---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - sealedsecret.yaml
  - rbac.yaml
# Generated so a peer-exporter.py change gets a new name and rolls the Deployment.
configMapGenerator:
  - name: peer-exporter
    namespace: tailscale-subnet-router
    files:
      - peer-exporter.py
