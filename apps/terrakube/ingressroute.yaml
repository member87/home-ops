---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: terrakube-ui
  namespace: terrakube
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`terrakube.lab.jackhumes.com`)
      kind: Rule
      services:
        - name: terrakube-ui-service
          port: 8080
  tls:
    secretName: terrakube-tls
---
# Dex is reverse-proxied under the API host at /dex (matches security.dexIssuerUri
# and the OIDC client's redirect URI). The PathPrefix route must win over the
# catch-all API route on the same host, hence the explicit priorities.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: terrakube-api
  namespace: terrakube
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`terrakube-api.lab.jackhumes.com`) && PathPrefix(`/dex`)
      kind: Rule
      priority: 20
      services:
        - name: terrakube-dex
          port: 5556
    - match: Host(`terrakube-api.lab.jackhumes.com`)
      kind: Rule
      priority: 10
      services:
        - name: terrakube-api-service
          port: 8080
  tls:
    secretName: terrakube-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: terrakube-registry
  namespace: terrakube
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`terrakube-registry.lab.jackhumes.com`)
      kind: Rule
      services:
        - name: terrakube-registry-service
          port: 8075
  tls:
    secretName: terrakube-tls
---
# The only publicly reachable part of Terrakube: GitHub webhook delivery, arriving over the
# FRP tunnel (Caddy terminates TLS on the edge, so this listens on the plain `web`
# entrypoint like the other FRP-fronted routes). It points at the gatekeeper, never at the
# API: the gate verifies the GitHub HMAC and drops fork pull requests before Terrakube -
# which has no fork check of its own - can run tofu with this repo's credentials.
# No CrowdSec middleware here on purpose: an unsigned request is rejected outright, and
# banning GitHub's delivery IPs would only break the integration.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: terrakube-webhook-gate
  namespace: terrakube
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`terrakube-hook.jackhumes.com`) && PathPrefix(`/webhook/`)
      kind: Rule
      services:
        - name: terrakube-webhook-gate
          port: 8080
