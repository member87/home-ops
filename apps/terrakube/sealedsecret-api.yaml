---
# api.existingSecret: true - the chart won't render this itself.
# PatSecret/InternalSecret are double-base64 (matches chart's own `| b64enc` on
# these two specific keys; the app expects base64-encoded key material).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: terrakube-api-secrets
  namespace: terrakube
spec:
  encryptedData:
    PatSecret: 
    InternalSecret: 
    DexClientId: 
    TerrakubeRedisPassword: 
    AwsStorageAccessKey: 
    AwsStorageSecretKey: 
    DatasourcePassword: 
  template:
    metadata:
      name: terrakube-api-secrets
      namespace: terrakube
    type: Opaque
