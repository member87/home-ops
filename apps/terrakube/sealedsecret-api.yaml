---
# api.existingSecret: true - PatSecret/InternalSecret are base64-encoded values (matches the chart template b64enc on those two keys).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: terrakube-api-secrets
  namespace: terrakube
spec:
  encryptedData:
    PatSecret: 
    InternalSecret: 
    DexClientId: 
    TerrakubeRedisPassword: 
    AwsStorageAccessKey: 
    AwsStorageSecretKey: 
    DatasourcePassword: 
  template:
    metadata:
      name: terrakube-api-secrets
      namespace: terrakube
    type: Opaque
