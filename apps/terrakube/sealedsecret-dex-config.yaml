---
# Full Dex config (dex.configSecret.create: false / name: terrakube-dex-config).
# Holds the Pocket ID OIDC client secret, so the whole config lives here rather than in
# the HelmRelease values. Keep `issuer` in sync with dex.config.issuer in
# flux/helm/terrakube/helmrelease.yaml.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: terrakube-dex-config
  namespace: terrakube
spec:
  encryptedData:
    config.yaml: 
  template:
    metadata:
      name: terrakube-dex-config
      namespace: terrakube
    type: Opaque
