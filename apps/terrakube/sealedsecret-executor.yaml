---
# executor.existingSecret: true - the chart won't render this itself.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: terrakube-executor-secrets
  namespace: terrakube
spec:
  encryptedData:
    InternalSecret: 
    TerrakubeRedisPassword: 
    AwsTerraformStateAccessKey: 
    AwsTerraformStateSecretKey: 
    AwsTerraformOutputAccessKey: 
    AwsTerraformOutputSecretKey: 
  template:
    metadata:
      name: terrakube-executor-secrets
      namespace: terrakube
    type: Opaque
