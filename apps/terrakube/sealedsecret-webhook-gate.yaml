---
# GitHub webhook HMAC secret. Terrakube derives the v1 webhook secret deterministically as
# base64(workspace id) in GitHubWebhookService.createOrUpdateWebhook, and registers that same
# value with GitHub. The gatekeeper needs the identical secret so it can verify deliveries
# before forwarding them, so this is that value - sealed because anyone holding it can forge
# a "push to main" delivery and trigger an apply.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: terrakube-webhook-gate-secret
  namespace: terrakube
spec:
  encryptedData:
    GITHUB_WEBHOOK_SECRET: 
  template:
    metadata:
      name: terrakube-webhook-gate-secret
      namespace: terrakube
    type: Opaque
