---
# Terrakube's webhook endpoint cannot be exposed to the internet directly: it verifies the
# GitHub HMAC but has no notion of forks (grep for "fork" in its GitHub webhook service finds
# nothing), so any pull request from any fork of this public repo would run tofu plan in the
# executor - with AWS keys, the frps token and the Headscale preauth key in scope. This
# gatekeeper sits in front of it and forwards only events that are safe to act on.
apiVersion: v1
kind: ConfigMap
metadata:
  name: terrakube-webhook-gate
  namespace: terrakube
data:
  gate.py: |
    import hashlib
    import hmac
    import json
    import os
    import sys
    import urllib.error
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    UPSTREAM = os.environ.get("UPSTREAM", "http://terrakube-api-service:8080").rstrip("/")
    SECRET = os.environ.get("GITHUB_WEBHOOK_SECRET", "").encode()
    REPO = os.environ.get("ALLOWED_REPO", "")
    SENDERS = {s.strip() for s in os.environ.get("ALLOWED_SENDERS", "").split(",") if s.strip()}
    BRANCH = os.environ.get("APPLY_BRANCH", "main")
    MAX_BODY = 2 * 1024 * 1024

    FORWARDED_HEADERS = (
        "content-type",
        "x-github-event",
        "x-github-delivery",
        "x-hub-signature",
        "x-hub-signature-256",
    )


    def log(msg):
        print(f"[webhook-gate] {msg}", flush=True)


    def signature_ok(body, provided):
        if not SECRET:
            return False
        if not provided or not provided.startswith("sha256="):
            return False
        expected = "sha256=" + hmac.new(SECRET, body, hashlib.sha256).hexdigest()
        return hmac.compare_digest(expected, provided)


    def decide(event, payload):
        """Return (forward: bool, reason: str)."""
        repo = payload.get("repository", {}).get("full_name")
        if REPO and repo != REPO:
            return False, f"repository {repo!r} is not {REPO!r}"

        if event == "push":
            ref = payload.get("ref", "")
            if ref != f"refs/heads/{BRANCH}":
                return False, f"push to {ref!r} is not refs/heads/{BRANCH}"
            if payload.get("deleted"):
                return False, "branch deletion"
            return True, f"push to {BRANCH}"

        if event == "pull_request":
            action = payload.get("action")
            if action not in ("opened", "synchronize", "reopened"):
                return False, f"pull_request action {action!r} is not actionable"
            pr = payload.get("pull_request", {})
            head = pr.get("head", {}).get("repo") or {}
            # The fork check. head.repo is null when the fork was deleted, and
            # differs from repository.full_name for every cross-repo pull request.
            if head.get("full_name") != repo:
                return False, f"fork pull request from {head.get('full_name')!r}"
            if pr.get("base", {}).get("ref") != BRANCH:
                return False, f"pull request targets {pr.get('base', {}).get('ref')!r}"
            return True, f"pull_request {action} #{pr.get('number')}"

        if event == "issue_comment":
            if payload.get("action") != "created":
                return False, "comment edit/delete"
            if "pull_request" not in payload.get("issue", {}):
                return False, "comment on an issue, not a pull request"
            sender = payload.get("sender", {}).get("login")
            if sender not in SENDERS:
                return False, f"commenter {sender!r} is not allowlisted"
            return True, f"issue_comment by {sender}"

        return False, f"event {event!r} is not handled"


    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"
        server_version = "terrakube-webhook-gate"

        def log_message(self, fmt, *args):  # quieter default access log
            return

        def _reply(self, code, text="", headers=None):
            body = text.encode()
            self.send_response(code)
            for key, value in (headers or {}).items():
                self.send_header(key, value)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path in ("/healthz", "/readyz"):
                self._reply(200, "ok")
            else:
                self._reply(404, "not found")

        def do_POST(self):
            if not self.path.startswith("/webhook/v"):
                self._reply(404, "not found")
                return

            length = int(self.headers.get("Content-Length") or 0)
            if length <= 0 or length > MAX_BODY:
                self._reply(400, "bad content-length")
                return
            body = self.rfile.read(length)

            if not signature_ok(body, self.headers.get("X-Hub-Signature-256")):
                log(f"rejected {self.path}: bad or missing signature")
                self._reply(401, "bad signature")
                return

            event = self.headers.get("X-GitHub-Event", "")
            if event == "ping":
                log("ping acknowledged")
                self._reply(200, "pong")
                return

            try:
                payload = json.loads(body)
            except json.JSONDecodeError:
                self._reply(400, "invalid json")
                return

            forward, reason = decide(event, payload)
            if not forward:
                log(f"dropped {event}: {reason}")
                self._reply(202, f"ignored: {reason}")
                return

            log(f"forwarding {event}: {reason}")
            headers = {k: v for k, v in self.headers.items() if k.lower() in FORWARDED_HEADERS}
            request = urllib.request.Request(
                url=f"{UPSTREAM}{self.path}", method="POST", data=body, headers=headers
            )
            try:
                with urllib.request.urlopen(request, timeout=30) as response:
                    log(f"upstream {response.status} for {event}")
                    self._reply(response.status, "forwarded")
            except urllib.error.HTTPError as error:
                detail = error.read().decode(errors="replace")[:200]
                log(f"upstream error {error.code} for {event}: {detail}")
                self._reply(502, "upstream rejected the event")
            except urllib.error.URLError as error:
                log(f"upstream unreachable: {error.reason}")
                self._reply(502, "upstream unreachable")


    def main():
        if not SECRET:
            log("GITHUB_WEBHOOK_SECRET is empty - refusing to start")
            sys.exit(1)
        if not REPO:
            log("ALLOWED_REPO is empty - refusing to start")
            sys.exit(1)
        log(f"listening on :8080, upstream {UPSTREAM}, repo {REPO}, apply branch {BRANCH}")
        ThreadingHTTPServer(("", 8080), Handler).serve_forever()


    if __name__ == "__main__":
        main()
