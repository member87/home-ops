---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinyauth
  namespace: tinyauth
  labels:
    app: tinyauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tinyauth
  template:
    metadata:
      labels:
        app: tinyauth
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: tinyauth
      containers:
        - name: tinyauth
          image: ghcr.io/tinyauthapp/tinyauth:v5.2.0
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          # Tinyauth v5 config: TINYAUTH_<SECTION>_<KEY>. Tinyauth refuses to
          # start on unknown TINYAUTH_* variables.
          env:
            # General configuration
            - name: TINYAUTH_APPURL
              value: "https://tinyauth.lab.jackhumes.com"
            # ACLs are not configured via Kubernetes annotations; skip the
            # Kubernetes label provider (it needs RBAC on Ingresses).
            - name: TINYAUTH_LABELPROVIDER
              value: "none"
            - name: TINYAUTH_AUTH_SECURECOOKIE
              value: "true"
            - name: TINYAUTH_AUTH_SESSIONEXPIRY
              value: "86400"
            # Traefik runs in the pod network; trust its X-Forwarded-For so
            # client IPs are the real clients (v4 trusted every proxy).
            - name: TINYAUTH_AUTH_TRUSTEDPROXIES
              value: "10.244.0.0/16"
            # No local users - we only use OAuth
            # OAuth provider configuration - Pocket ID
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME
              value: "Pocket ID"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL
              value: "https://auth.jackhumes.com/authorize"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL
              value: "https://auth.jackhumes.com/api/oidc/token"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL
              value: "https://auth.jackhumes.com/api/oidc/userinfo"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES
              value: "openid,profile,email"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_REDIRECTURL
              value: "https://tinyauth.lab.jackhumes.com/api/oauth/callback/pocketid"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID
              value: "bc64c2f1-968f-4db5-aa26-2ef3a5d521e5"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: tinyauth-secrets
                  key: POCKETID_CLIENT_SECRET
            # Auto-redirect to Pocket ID (skip local login page)
            - name: TINYAUTH_OAUTH_AUTOREDIRECT
              value: "pocketid"
            # Custom background image from CDN
            - name: TINYAUTH_UI_BACKGROUNDIMAGE
              value: "https://cdn.lab.jackhumes.com/images/london-5297395.jpg"
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "250m"
