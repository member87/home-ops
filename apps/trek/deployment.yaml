---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trek
  namespace: trek
  labels:
    app: trek
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trek
  template:
    metadata:
      labels:
        app: trek
    spec:
      containers:
        - name: trek
          image: mauriceboe/trek:3.4.1
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: TZ
              value: "Europe/London"
            - name: LOG_LEVEL
              value: "info"
            - name: APP_URL
              value: "https://trek.lab.jackhumes.com"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: trek-secrets
                  key: ENCRYPTION_KEY
            - name: OIDC_ISSUER
              value: "https://auth.jackhumes.com"
            - name: OIDC_CLIENT_ID
              value: "9a3eaef3-8efa-47ca-878f-8f3955554060"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trek-secrets
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_DISPLAY_NAME
              value: "Pocket ID"
            - name: OIDC_ONLY
              value: "true"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETUID
                - SETGID
          volumeMounts:
            - name: data
              mountPath: /app/data
              subPath: data
            - name: data
              mountPath: /app/uploads
              subPath: uploads
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trek-data
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
