# Applications
# Generated per-component Flux Kustomizations: each path reconciles independently,
# so a commit only mutates the components whose manifests actually changed.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 1h0m0s
  retryInterval: 2m0s
  timeout: 5m0s
  path: ./apps/alloy
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
---
