# One Kustomization per Helm release: a failure in one chart no longer blocks the others,
# and the dependency edges match what each HelmRelease declared before the migration.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: helm-cert-manager
  namespace: flux-system
spec:
  interval: 15m0s
  retryInterval: 2m0s
  timeout: 15m0s
  path: ./flux/helm/cert-manager
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: helm-immich
  namespace: flux-system
spec:
  interval: 15m0s
  retryInterval: 2m0s
  timeout: 15m0s
  path: ./flux/helm/immich
