# Infrastructure components
# Generated per-component Flux Kustomizations: each path reconciles independently,
# so a commit only mutates the components whose manifests actually changed.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 15m0s
  retryInterval: 2m0s
  timeout: 5m0s
  path: ./infrastructure/cert-manager
  prune: true
  wait: true
  dependsOn:
    - name: helm-cert-manager
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 15m0s
  retryInterval: 2m0s
  timeout: 5m0s
  path: ./infrastructure/metallb
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
spec:
  interval: 15m0s
  retryInterval: 2m0s
  timeout: 5m0s
  path: ./infrastructure/metallb/config
  prune: true
  wait: true
  dependsOn:
    - name: metallb
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  interval: 15m0s
  retryInterval: 2m0s
  timeout: 5m0s
  path: ./infrastructure/sealed-secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 15m0s
  retryInterval: 2m0s
  timeout: 5m0s
  path: ./infrastructure/traefik
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
---
# The entrypoint manages itself: without this, a change to flux/system (such as the
# path change in this migration) is never delivered and has to be applied by hand.
# wait: false because it reconciles its own parent Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 15m0s
  retryInterval: 2m0s
  timeout: 5m0s
  path: ./flux/system
  prune: false
  wait: false
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
