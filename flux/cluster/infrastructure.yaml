  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h0m0s
  retryInterval: 2m0s
  timeout: 5m0s
  path: ./infrastructure/traefik
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
