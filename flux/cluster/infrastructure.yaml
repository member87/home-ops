# Infrastructure components
# Generated per-component Flux Kustomizations: each path reconciles independently,
# so a commit only mutates the components whose manifests actually changed.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 1h0m0s
  retryInterval: 2m0s
  timeout: 5m0s
  path: ./infrastructure/cert-manager
  prune: true
  wait: true
  dependsOn:
    - name: helm-controllers
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 1h0m0s
  retryInterval: 2m0s
  timeout: 5m0s
  path: ./infrastructure/metallb
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
spec:
  interval: 1h0m0s
  retryInterval: 2m0s
  timeout: 5m0s
  path: ./infrastructure/metallb/config
  prune: true
  wait: true
  dependsOn:
    - name: metallb
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  interval: 1h0m0s
  retryInterval: 2m0s
  timeout: 5m0s
  path: ./infrastructure/sealed-secrets
  prune: true
