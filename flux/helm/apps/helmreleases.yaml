# HelmReleases for charts with real upstream dependencies.
# reconcileStrategy: ChartVersion means an unrelated commit no longer re-renders or
# re-upgrades these releases; only a Chart.yaml version bump or a values change here does.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: flux-system
spec:
  suspend: true
  interval: 10m0s
  releaseName: immich
  targetNamespace: immich
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: apps/immich
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: home-ops
        namespace: flux-system
      interval: 10m0s
  values:
    enabled: false

    immich:
      controllers:
        main:
          containers:
            main:
              image:
                tag: v2.6.1
              env:
                DB_URL:
                  valueFrom:
                    secretKeyRef:
                      name: immich-secrets
                      key: DB_URL
                DB_VECTOR_EXTENSION: pgvector
                TZ: Europe/London

      immich:
        persistence:
          library:
            existingClaim: immich-library

      server:
        controllers:
          main:
            replicas: 1
            strategy: RollingUpdate
            rollingUpdate:
              unavailable: 1
              surge: 0
            pod:
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app.kubernetes.io/controller: main
                          app.kubernetes.io/instance: immich
                          app.kubernetes.io/name: server
                      topologyKey: kubernetes.io/hostname
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/controller: main
                      app.kubernetes.io/instance: immich
                      app.kubernetes.io/name: server
            containers:
              main:
                env:
                  IMMICH_CONFIG_FILE: /immich-config/immich-config.yaml
                resources:
                  limits:
                    memory: 1536Mi
        persistence:
          immich-config:
            enabled: true
            type: secret
            name: immich-oidc-config
            globalMounts:
              - path: /immich-config
                readOnly: true

      valkey:
        enabled: true
        persistence:
          data:
            type: persistentVolumeClaim
            storageClass: longhorn
            size: 2Gi
            accessMode: ReadWriteOnce

      machine-learning:
        controllers:
          main:
            replicas: 1
            strategy: RollingUpdate
            rollingUpdate:
              unavailable: 1
              surge: 0
            pod:
              affinity:
                podAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app.kubernetes.io/controller: main
                          app.kubernetes.io/instance: immich
                          app.kubernetes.io/name: machine-learning
                      topologyKey: kubernetes.io/hostname
            containers:
              main:
                resources:
                  requests:
                    cpu: 300m
                    memory: 1Gi
                  limits:
                    cpu: 600m
                    memory: 2Gi
        persistence:
          cache:
            type: persistentVolumeClaim
            storageClass: longhorn
            size: 20Gi
            accessMode: ReadWriteOnce
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: flux-system
spec:
  suspend: false
  interval: 10m0s
  releaseName: pihole
  targetNamespace: pihole
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: apps/pihole
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: home-ops
        namespace: flux-system
      interval: 10m0s
  values:
    pihole:
      # Scale to 3 replicas for high availability
      replicaCount: 3
      strategyType: RollingUpdate
      maxSurge: 1
      maxUnavailable: 1
      # Admin password disabled - protected by Tinyauth/Pocket ID
      # Use empty password secret to disable Pi-hole authentication
      admin:
        existingSecret: "pihole-password-empty"
        passwordKey: "password"
      # Disable persistent storage - each replica builds its own gravity DB
      # from the configured adlists on startup. Config is managed via Helm values.
      # PVC with ReadWriteOnce would prevent scheduling multiple replicas.
      persistentVolumeClaim:
        enabled: false
      # Anti-affinity to spread Pi-hole pods across nodes
      antiaff:
        enabled: true
        avoidRelease: pihole
        strict: false
      # Topology spread for even distribution across nodes
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pihole
              release: pihole
      # Pod Disruption Budget - ensure at least 2 replicas are always running
      podDisruptionBudget:
        enabled: true
        minAvailable: 2
      # DNS Service Configuration - using LoadBalancer with MetalLB
      # externalTrafficPolicy: Cluster ensures kube-proxy creates DNAT rules
      # on ALL nodes, not just the node running Pi-hole. This is required for
      # Tailscale subnet router (on a different node) to forward DNS queries
      # to 10.0.0.201.
      serviceDns:
        mixedService: true
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        loadBalancerIP: "10.0.0.201"
        port: 53
        annotations:
          metallb.universe.tf/allow-shared-ip: pihole-svc
      # Web Interface Service Configuration
      # externalTrafficPolicy must match serviceDns for MetalLB shared IP
      serviceWeb:
        http:
          enabled: true
          port: 80
        https:
          enabled: true
          port: 443
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        loadBalancerIP: "10.0.0.201"
        annotations:
          metallb.universe.tf/allow-shared-ip: pihole-svc
      # DHCP Service - disable if not needed
      serviceDhcp:
        enabled: false
      # DNS Configuration
      DNS1: "1.1.1.1"
      DNS2: "1.0.0.1"
      # DNSMasq custom configuration
      dnsmasq:
        enableCustomDnsMasq: true
        customDnsEntries:
          # Wildcard DNS for lab domain - routes all *.lab.jackhumes.com to Traefik
          - address=/.lab.jackhumes.com/10.0.0.200
        customCnameEntries: []
        upstreamServers: []
      # Environment variables
      extraEnvVars:
        TZ: "UTC"
        WEBPASSWORD: ""
        FTLCONF_dns_listeningMode: "all"
        FTLCONF_misc_dnsmasq_lines: "address=/.lab.jackhumes.com/10.0.0.200"
      # Pod DNS Configuration
      # Use external DNS during startup to avoid chicken-and-egg problem
      podDnsConfig:
        enabled: true
        policy: "None"
        nameservers:
          - 1.1.1.1
          - 1.0.0.1
      # Resources
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi
      # Additional blocklists
      adlists:
        - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
        - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.txt
      # Pod annotations for Prometheus auto-discovery
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9617"
        prometheus.io/path: "/metrics"
      # Monitoring - pihole-exporter sidecar for Prometheus metrics
      monitoring:
        podMonitor:
          enabled: false
        sidecar:
          enabled: true
          port: 9617
          image:
            repository: ekofr/pihole-exporter
            tag: v1.2.0
            pullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: flux-system
spec:
  suspend: false
  interval: 10m0s
  releaseName: podinfo
  targetNamespace: podinfo
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: apps/podinfo
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: home-ops
        namespace: flux-system
      interval: 10m0s
  values:
    replicaCount: 1
    service:
      enabled: true
      type: ClusterIP
      httpPort: 9898
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 64Mi
    ui:
      color: "#34577c"
      message: "Welcome to Podinfo - Home Lab"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
  namespace: flux-system
spec:
  suspend: false
  interval: 10m0s
  releaseName: radar
  targetNamespace: radar
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: radar
      version: 1.6.1
      sourceRef:
        kind: HelmRepository
        name: skyhook
        namespace: flux-system
      interval: 10m0s
  values:
    image:
      tag: "1.6.1"
    auth:
      mode: oidc
      existingSecret: radar-oidc-secret
      existingSecretKey: auth-secret
      oidc:
        issuerURL: https://auth.jackhumes.com
        clientID: 0fe6c0e7-a42f-4cff-82b1-df3700417fb0
        existingSecret: radar-oidc-secret
        clientSecretKey: client-secret
        redirectURL: https://radar.lab.jackhumes.com/auth/callback
        postLogoutRedirectURL: https://radar.lab.jackhumes.com
        groupsClaim: groups
        scopes:
          - openid
          - profile
          - email
          - groups
    ingress:
      enabled: false
    mcp:
      enabled: false
    rbac:
      helm: false
      podExec: false
      podLogs: true
      portForward: false
      secrets: false
      viewRBAC: false
    traffic:
      prometheusUrl: http://prometheus.prometheus.svc.cluster.local:9090
    timeline:
      storage: sqlite
      retention: 168h
    persistence:
      enabled: true
      storageClassName: longhorn
      size: 5Gi
