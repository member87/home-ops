# HelmReleases for charts with real upstream dependencies.
# reconcileStrategy: ChartVersion means an unrelated commit no longer re-renders or
# re-upgrades these releases; only a Chart.yaml version bump or a values change here does.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  suspend: false
  interval: 10m0s
  releaseName: cert-manager
  targetNamespace: cert-manager
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: charts/cert-manager
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: home-ops
        namespace: flux-system
      interval: 10m0s
  values:
    installCRDs: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  suspend: false
  interval: 10m0s
  releaseName: longhorn
  targetNamespace: longhorn-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: infrastructure/longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: home-ops
        namespace: flux-system
      interval: 10m0s
  values:
    longhorn:
      global:
        timezone: Europe/London

      # Hotfix for Longhorn 1.11.0 regressions
      image:
        longhorn:
          manager:
            tag: v1.11.1
          instanceManager:
            tag: v1.11.1

      # Longhorn settings
      defaultSettings:
        # Default replica count - 2 for multi-node redundancy
        defaultReplicaCount: 2
        # Prefer local data for performance
        defaultDataLocality: best-effort
        # Storage reservation for system operations
        storageMinimalAvailablePercentage: 15
        storageOverProvisioningPercentage: 100
        # Auto-delete workload pods when volume is detached unexpectedly
        autoDeletePodWhenVolumeDetachedUnexpectedly: true
        # Node drain policy
        nodeDrainPolicy: block-if-contains-last-replica
        # Snapshot cleanup
        autoCleanupSystemGeneratedSnapshot: true
        # Concurrent volume backup/restore
        concurrentAutomaticEngineUpgradePerNodeLimit: 1
        # Talos Linux compatibility - use /var/lib/longhorn
        defaultDataPath: /var/lib/longhorn
        # Create default disk on labeled nodes only (or all if none labeled)
        createDefaultDiskLabeledNodes: false
        # Guaranteed instance manager CPU
        guaranteedInstanceManagerCPU: 12
        # Orphan management
        orphanAutoDeletion: true
        # Talos-specific: set the system managed components to false
        # since Talos manages these at the OS level
        systemManagedComponentsNodeSelector: ""
        # V2 Data Engine disabled - using standard iSCSI with Talos extensions
        v2DataEngine: false

      defaultBackupStore:
        backupTarget: nfs://10.0.0.9:/volume1/kubernetes/longhorn-backups?nfsOptions=nfsvers=3,proto=tcp,nolock,soft,timeo=300,retry=2
        pollInterval: 300

      # Storage Class settings
      persistence:
        # Set as default storage class
        defaultClass: true
        defaultClassReplicaCount: 2
        defaultFsType: ext4
        reclaimPolicy: Retain
        migratable: true

      # Longhorn Manager
      longhornManager:
        priorityClass: system-cluster-critical
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"

      # Longhorn Driver
      longhornDriver:
        priorityClass: system-cluster-critical
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"

      # Longhorn UI
      longhornUI:
        replicas: 1

      # Ingress for Longhorn UI (disabled - will use IngressRoute)
      ingress:
        enabled: false

      # Disable pre-upgrade checker (not needed for this cluster)
      preUpgradeChecker:
        jobEnabled: false
        upgradeVersionCheck: false

      # Disable post-delete job to avoid unnecessary cleanup jobs
      longhornPostDelete:
        enabled: false

      # CSI settings
      csi:
        attacherReplicaCount: 1
        provisionerReplicaCount: 1
        resizerReplicaCount: 1
        snapshotterReplicaCount: 1

      # Metrics for Prometheus
      metrics:
        serviceMonitor:
          enabled: false
