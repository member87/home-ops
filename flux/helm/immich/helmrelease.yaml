# Charts with a real upstream dependency. reconcileStrategy: ChartVersion keeps an
# unrelated commit from re-rendering or re-upgrading them; only a Chart.yaml version
# bump or a values change here does. One Kustomization per release keeps the
# dependency edges as narrow as they were before the migration.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 10m0s
  # Server start runs the database migrations; a large jump (v2 -> v3) outlasts the 5m default.
  timeout: 15m0s
  releaseName: immich
  targetNamespace: immich
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    # No rollback: migrations are one-way, and rolling back after one has run starts the old
    # server against a newer schema. A failed upgrade stays failed and is fixed forward.
    remediation:
      retries: 0
  chart:
    spec:
      chart: apps/immich
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: home-ops
        namespace: flux-system
      interval: 10m0s
  values:
    enabled: true

    immich:
      controllers:
        main:
          containers:
            main:
              image:
                # Shared by server and machine-learning, which must run the same version.
                # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
                tag: v3.3.5
              env:
                DB_URL:
                  valueFrom:
                    secretKeyRef:
                      name: immich-secrets
                      key: DB_URL
                DB_VECTOR_EXTENSION: pgvector
                TZ: Europe/London

      immich:
        persistence:
          library:
            existingClaim: immich-library

      server:
        controllers:
          main:
            replicas: 1
            strategy: RollingUpdate
            rollingUpdate:
              unavailable: 1
              surge: 0
            pod:
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app.kubernetes.io/controller: main
                          app.kubernetes.io/instance: immich
                          app.kubernetes.io/name: server
                      topologyKey: kubernetes.io/hostname
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/controller: main
                      app.kubernetes.io/instance: immich
                      app.kubernetes.io/name: server
            containers:
              main:
                env:
                  IMMICH_CONFIG_FILE: /immich-config/immich-config.yaml
                  # Prometheus metrics on :8081 (API) and :8082 (microservices), scraped
                  # by the immich-* jobs in apps/prometheus. Set here rather than through
                  # immich.metrics.enabled, which also creates ServiceMonitors.
                  IMMICH_TELEMETRY_INCLUDE: all
                # v3 runs API and microservices in one container; working through a job
                # backlog it went past 1.27Gi and was OOM-killed at the old 1536Mi limit,
                # then again at 3Gi while software-transcoding videos alongside face
                # detection (0.7Gi idle -> 2.9Gi in 15 minutes).
                # The request makes the scheduler count it, which it did not before.
                resources:
                  requests:
                    cpu: 850m
                    memory: 2Gi
                  limits:
                    memory: 5Gi
                    # iGPU from infrastructure/intel-gpu-plugin; ffmpeg.accel in the
                    # immich-oidc-config file selects VAAPI to use it.
                    gpu.intel.com/i915: 1
        persistence:
          immich-config:
            enabled: true
            type: secret
            name: immich-oidc-config
            globalMounts:
              - path: /immich-config
                readOnly: true

      valkey:
        enabled: true
        persistence:
          data:
            type: persistentVolumeClaim
            storageClass: longhorn
            size: 2Gi
            accessMode: ReadWriteOnce

      machine-learning:
        controllers:
          main:
            replicas: 1
            strategy: RollingUpdate
            rollingUpdate:
              unavailable: 1
              surge: 0
            pod:
              affinity:
                podAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app.kubernetes.io/controller: main
                          app.kubernetes.io/instance: immich
                          app.kubernetes.io/name: machine-learning
                      topologyKey: kubernetes.io/hostname
            containers:
              main:
                resources:
                  requests:
                    cpu: 600m
                    memory: 1Gi
                  limits:
                    cpu: 600m
                    memory: 2Gi
        persistence:
          cache:
            type: persistentVolumeClaim
            storageClass: longhorn
            size: 20Gi
            accessMode: ReadWriteOnce
