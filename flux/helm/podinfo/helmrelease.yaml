# Charts with a real upstream dependency. reconcileStrategy: ChartVersion keeps an
# unrelated commit from re-rendering or re-upgrading them; only a Chart.yaml version
# bump or a values change here does. One Kustomization per release keeps the
# dependency edges as narrow as they were before the migration.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  suspend: false
  interval: 10m0s
  releaseName: podinfo
  targetNamespace: podinfo
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: apps/podinfo
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: home-ops
        namespace: flux-system
      interval: 10m0s
  values:
    replicaCount: 1
    service:
      enabled: true
      type: ClusterIP
      httpPort: 9898
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 64Mi
    ui:
      color: "#34577c"
      message: "Welcome to Podinfo - Home Lab"
