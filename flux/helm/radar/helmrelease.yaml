# Charts with a real upstream dependency. reconcileStrategy: ChartVersion keeps an
# unrelated commit from re-rendering or re-upgrading them; only a Chart.yaml version
# bump or a values change here does. One Kustomization per release keeps the
# dependency edges as narrow as they were before the migration.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  suspend: false
  interval: 10m0s
  releaseName: radar
  targetNamespace: radar
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: radar
      version: 1.13.1
      sourceRef:
        kind: HelmRepository
        name: skyhook
        namespace: flux-system
      interval: 10m0s
  values:
    image:
      tag: "1.6.1"
    auth:
      mode: oidc
      existingSecret: radar-oidc-secret
      existingSecretKey: auth-secret
      oidc:
        issuerURL: https://auth.jackhumes.com
        clientID: 0fe6c0e7-a42f-4cff-82b1-df3700417fb0
        existingSecret: radar-oidc-secret
        clientSecretKey: client-secret
        redirectURL: https://radar.lab.jackhumes.com/auth/callback
        postLogoutRedirectURL: https://radar.lab.jackhumes.com
        groupsClaim: groups
        scopes:
          - openid
          - profile
          - email
          - groups
    ingress:
      enabled: false
    mcp:
      enabled: false
    rbac:
      helm: false
      podExec: false
      podLogs: true
      portForward: false
      secrets: false
      viewRBAC: false
    traffic:
      prometheusUrl: http://prometheus.prometheus.svc.cluster.local:9090
    timeline:
      storage: sqlite
      retention: 168h
    persistence:
      enabled: true
      storageClassName: longhorn
      size: 5Gi
