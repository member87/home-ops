# Terrakube: self-hosted Terraform/OpenTofu plan+apply UI for the stacks in terraform/.
# Namespace, TLS, IngressRoutes and every SealedSecret are plain manifests in
# apps/terrakube, packaged by that chart's templates/manifests.yaml glob wrapper.
# Values live here, not in the chart dir: reconcileStrategy: ChartVersion means chart-dir
# edits only deploy on a Chart.yaml version bump, while a values edit deploys immediately.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: terrakube
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  suspend: false
  interval: 10m0s
  releaseName: terrakube
  targetNamespace: terrakube
  # disableWait: this release delivers the SealedSecrets its own pods consume, so gating
  # the Helm operation on pod readiness deadlocks - a bad Secret keeps the pods pending,
  # the release stays pending-install for the whole timeout, and the corrected Secret
  # cannot be applied until it expires. Readiness is observed via the pods, not Helm.
  install:
    createNamespace: true
    disableWait: true
    remediation:
      retries: 3
    timeout: 10m
  upgrade:
    disableWait: true
    remediation:
      retries: 3
    timeout: 10m
  chart:
    spec:
      chart: apps/terrakube
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: home-ops
        namespace: flux-system
      interval: 10m0s
  values:
    # Renders the local manifests (glob wrapper) and enables the upstream subchart.
    enabled: true

    # All secret material (patSecret, internalSecret, database/minio/valkey passwords, the
    # Pocket ID OIDC client secret) is supplied by SealedSecrets in apps/terrakube via
    # existingSecret / configSecret.create: false - never as literal values here.
    terrakube:
      name: "terrakube"
      enableIPv6: false

      security:
        useOpenLDAP: false
        # Must match the Pocket ID group name emitted in the `groups` claim - the only
        # group on this instance is `admin`, and it is the allowed group for this client.
        adminGroup: "admin"
        dexClientId: "terrakube"
        dexClientScope: "email openid profile offline_access groups"
        dexIssuerUri: "https://terrakube-api.lab.jackhumes.com/dex"

      # Dex reads its whole config from the terrakube-dex-config SealedSecret because it
      # embeds the Pocket ID client secret. config.issuer is duplicated here (non-sensitive)
      # only because terrakube's own api/ui templates read .Values.dex.config.issuer; keep it
      # in sync with the issuer inside that Secret.
      dex:
        enabled: true
        config:
          issuer: "https://terrakube-api.lab.jackhumes.com/dex"
        configSecret:
          create: false
          name: terrakube-dex-config
        volumes: []
        # A memory limit puts dex in the first Talos OOM tier with the other apps; without one
        # it would rank alongside the cluster infrastructure (see talos/patches/oom-config.yaml).
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi

      storage:
        defaultStorage: true
        default:
          region: "us-east-1"

      minio:
        auth:
          existingSecret: terrakube-minio-credentials
        defaultBuckets: "terrakube"
        persistence:
          storageClass: longhorn
          size: 20Gi

      postgresql:
        auth:
          username: "terrakube"
          database: "terrakube"
          existingSecret: terrakube-postgresql-credentials
        primary:
          persistence:
            storageClass: longhorn
            size: 10Gi
          # The chart's default "nano" preset caps postgres at 192Mi, which it outgrew as
          # soon as the API held real connections: it booted, reported "ready to accept
          # connections", then died and looped with "database system was interrupted".
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

      valkey:
        auth:
          enabled: true
          usersExistingSecret: "terrakube-valkey-users"
          aclUsers:
            default:
              permissions: "~* &* +@all"
        # Same reason as dex. initResources too: a pod only gets a pod-level memory limit
        # when every container, init containers included, has one.
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        initResources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi

      # Sizing on a 3-node, control-plane-only cluster with ~7.3Gi allocatable per node:
      # requests stay small so the scheduler and the API server are not starved, while the
      # limits stay above 1Gi because these are Paketo buildpack (Liberica) images whose JVM
      # memory calculator refuses to boot unless the container sees more than the ~820Mi of
      # fixed regions it reserves (metaspace + code cache + 250 thread stacks).
      #
      # Heap is capped explicitly. Left alone, the calculator hands the whole remainder of the
      # 2Gi limit to the heap (-Xmx ~1.2-1.3G): the two idle JVMs sat at ~2.8Gi on one node.
      # Being the largest limited pods, they are now the first Talos OOM victims
      # (talos/patches/oom-config.yaml), so a smaller heap also means fewer kills. The
      # calculator honours a user -Xmx and still sizes metaspace and code cache around it.
      # ExitOnOutOfMemoryError is on, so an undersized heap shows up as restarts.
      api:
        enabled: true
        existingSecret: true
        # Chart default is true: seeds demo organizations (aws/azure/gcp/simple) and makes
        # the API sync public registry modules on every start.
        loadSampleData: false
        version: "2.33.1"
        replicaCount: "1"
        env:
          - name: JAVA_TOOL_OPTIONS
            value: "-Xmx768m"
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi

      executor:
        enabled: true
        existingSecret: true
        version: "2.33.1"
        replicaCount: "1"
        # Upstream wires the executor's tofu list through the API proxy
        # (tofuReleasesUrl=${AzBuilderApiUrl}/tofu/index.json) but sends the terraform
        # list straight to releases.hashicorp.com, which answers 406 to the executor's
        # HTTP client and then NPEs in TerraformDownloader - killing every job, tofu
        # workspaces included. Use the API's cached proxy for both. env overrides the
        # value the chart puts in terrakube-executor-config.
        env:
          - name: CustomTerraformReleasesUrl
            value: "http://terrakube-api-service:8080/terraform/index.json"
          # tofu runs as a child process in this container, so the limit keeps headroom
          # above the heap for it.
          - name: JAVA_TOOL_OPTIONS
            value: "-Xmx512m"
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi

      # The private module/provider registry is not used: modules come from the public
      # registry and this repo. It is a third JVM costing ~1Gi of requests, so it stays off
      # along with its IngressRoute, cert SAN and SealedSecret.
      registry:
        enabled: false

      ui:
        enabled: true
        version: "2.33.1"
        replicaCount: "1"
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi

      # Chart ingress objects are off - Traefik IngressRoutes for these hosts live in
      # apps/terrakube/ingressroute.yaml. Domains stay set because the UI/API templates
      # read ingress.*.domain to build the OIDC redirect and API URLs regardless.
      ingress:
        useTls: true
        ui:
          enabled: false
          domain: "terrakube.lab.jackhumes.com"
        api:
          enabled: false
          domain: "terrakube-api.lab.jackhumes.com"
        registry:
          enabled: false
          domain: "terrakube-registry.lab.jackhumes.com"
        executor:
          enabled: false
        dex:
          enabled: false
