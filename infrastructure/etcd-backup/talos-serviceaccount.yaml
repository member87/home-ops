---
# Talos issues a client certificate with only the os:etcd:backup role (etcd snapshots, nothing
# else) into Secret etcd-snapshot (key config, a talosconfig for endpoint talos.default). Talos
# refuses it until talos/patches/etcd-backup-api-access.yaml is on every node.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-snapshot
  namespace: etcd-backup
spec:
  roles:
    - os:etcd:backup
