---
# The Flux installation itself, managed by Flux Operator (flux/helm/flux-operator). Replaces
# the hand-run `flux install`: bumping the version here upgrades every controller.
#
# No spec.sync: the GitRepository and root Kustomization stay in flux/system, reconciled by
# the flux-system Kustomization as before. The component list, network policies and
# controller flags match what `flux install --components-extra=image-reflector-controller,
# image-automation-controller` produced, so taking over changed nothing but ownership.
#
# prune: disabled - deleting a FluxInstance uninstalls Flux. Never let Flux prune it.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  distribution:
    # renovate: datasource=github-releases depName=fluxcd/flux2
    version: "2.9.6"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: cluster.local
