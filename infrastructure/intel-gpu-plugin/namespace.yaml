---
apiVersion: v1
kind: Namespace
metadata:
  name: intel-gpu-plugin
  labels:
    app.kubernetes.io/name: intel-gpu-plugin
    # The plugin reads /dev/dri and /sys/class/drm and writes the kubelet
    # device-plugin socket, all hostPath mounts that baseline forbids. It runs
    # unprivileged with every capability dropped.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
