---
# Kata Containers (siderolabs/kata-containers in the Talos schematic): a pod with
# `runtimeClassName: kata` runs in its own Cloud Hypervisor VM with its own kernel, so root
# or `privileged: true` inside it reaches the guest only. The extension sets
# privileged_without_host_devices, so no host device is passed in. Used by the GitHub
# Actions runners (flux/helm/arc-runners) for Docker-in-Docker.
#
# The VM gets Kata's default 2048MiB plus the pod's limits, and memory the guest has touched
# (its page cache too) is never handed back to the host. The pod cgroup holds the limits plus
# podFixed, so podFixed covers those 2048MiB and 256MiB for Cloud Hypervisor and virtiofsd.
# With 256Mi the cgroup was 1.75GiB smaller than the VM, and the nix-cache builder's VM died
# mid-build (exit 255) with the pod near its cgroup limit.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
overhead:
  podFixed:
    cpu: 250m
    memory: 2304Mi
