# Grafana alert rules for longhorn, applied by the grafana Terrakube workspace
# (terraform/grafana/alerting.tf). Every alerts/*.yaml here joins one rule group named
# "longhorn" in the Alerts folder; the rule fields are Grafana's file-provisioning format.
rules:
  - uid: longhorn-backup-stale
    title: Longhorn Backup Stale
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: max by (namespace, pvc) (jevil_backup_age_seconds)
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 129600
                type: gt
    noDataState: OK
    execErrState: OK
    for: 10m
    annotations:
      summary: A Longhorn volume has no backup newer than 36 hours
      description: The newest Longhorn backup of {{ $labels.namespace }}/{{ $labels.pvc }} is {{ humanizeDuration $values.B.Value }} old; backup-daily runs at 12:00. Check the volume's backups in the Longhorn UI and the NAS backup target. The Jevil daily report lists every stale volume.
    labels:
      severity: critical

  # +Inf when the CronJob does not exist; a CronJob that never succeeded counts from its
  # creation.
