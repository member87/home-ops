# Grafana alert rules for metallb, applied by the grafana Terrakube workspace
# (terraform/grafana/alerting.tf). Every alerts/*.yaml here joins one rule group named
# "metallb" in the Alerts folder; the rule fields are Grafana's file-provisioning format.
rules:
  - uid: metallb-config-stale
    title: MetalLB Config Stale
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: prometheus
        model:
          expr: max by (kubernetes_pod_name, component) (metallb_k8s_client_config_stale_bool)
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: A
          refId: B
          type: reduce
          reducer: last
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          expression: B
          refId: C
          type: threshold
          conditions:
            - evaluator:
                params:
                  - 0
                type: gt
    noDataState: OK
    execErrState: OK
    for: 10m
    annotations:
      summary: MetalLB {{ $labels.component }} {{ $labels.kubernetes_pod_name }} is running a stale config
      description: MetalLB {{ $labels.component }} {{ $labels.kubernetes_pod_name }} rejected the latest configuration 10 minutes ago and keeps using the previous one, so address pool or advertisement changes (Traefik on 10.0.0.200, Pi-hole on 10.0.0.201) are not applied. Its logs in metallb-system name the invalid resource.
    labels:
      severity: warning
