---
# MetalLB >= 0.16 serves /metrics over HTTPS and authenticates each scrape with a
# TokenReview + SubjectAccessReview. Upstream only grants those in the
# metallb-native-prometheus.yaml variant, which also needs the Prometheus Operator
# CRDs this cluster does not run, so install.yaml stays the plain native manifest and
# the two rules live here. Without them every scrape gets HTTP 500.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metallb-system:metrics-auth
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metallb-system:metrics-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metallb-system:metrics-auth
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: metallb-system
  - kind: ServiceAccount
    name: speaker
    namespace: metallb-system
