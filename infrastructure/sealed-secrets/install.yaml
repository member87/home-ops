# jevil:vendor repo=bitnami-labs/sealed-secrets version=v0.40.0 url=https://github.com/bitnami-labs/sealed-secrets/releases/download/{version}/controller.yaml skip=CustomResourceDefinition
# Vendored from upstream sealed-secrets v0.40.0 controller.yaml (all objects
# except the CRD, which lives in crds.yaml):
#   https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.40.0/controller.yaml
# Renovate is disabled for this file (infrastructure/**/install.yaml rule).
# Upgrade by re-vendoring the whole manifest, never by bumping the image alone.
#
# Local deviations from upstream:
# - namespace kube-system -> sealed-secrets
# - Deployment selector stays app.kubernetes.io/name=sealed-secrets-controller
#   (immutable, matches the existing Deployment); pods carry both labels
# - ClusterRole secrets-unsealer is named sealed-secrets-controller because the
#   existing ClusterRoleBinding's roleRef (immutable) points at that name
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations: {}
  labels:
    name: sealed-secrets-controller
  name: sealed-secrets-controller
  namespace: sealed-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  labels:
    name: sealed-secrets-controller
  name: sealed-secrets-controller
  namespace: sealed-secrets
spec:
  minReadySeconds: 30
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: sealed-secrets-controller
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations: {}
      labels:
        name: sealed-secrets-controller
        app.kubernetes.io/name: sealed-secrets-controller
    spec:
      containers:
        - args: []
          command:
            - controller
          env: []
          image: docker.io/bitnami/sealed-secrets-controller:0.40.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          name: sealed-secrets-controller
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: metrics
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          stdin: false
          tty: false
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      imagePullSecrets: []
      initContainers: []
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: sealed-secrets-controller
      terminationGracePeriodSeconds: 30
      volumes:
        - emptyDir: {}
          name: tmp
---
