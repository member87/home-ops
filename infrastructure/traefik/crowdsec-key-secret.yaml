---
# CrowdSec LAPI bouncer key, mounted into Traefik and referenced by every
# crowdsec-bouncer Middleware through crowdsecLapiKeyFile.
#
# The previous key was committed in plaintext in two Middleware manifests in a public
# repo, so it has been revoked in the LAPI and this is a freshly issued one. Anyone
# holding a bouncer key can read every decision from the LAPI.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: crowdsec-bouncer-key
  namespace: traefik
spec:
  encryptedData:
    lapi-key: 
  template:
    metadata:
      name: crowdsec-bouncer-key
      namespace: traefik
    type: Opaque
