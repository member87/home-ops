# jevil:vendor repo=traefik/traefik version=v3.7.17 url=https://raw.githubusercontent.com/traefik/traefik/{version}/docs/content/reference/dynamic-configuration/kubernetes-crd-rbac.yml image=traefik rename=traefik-ingress-controller:traefik
# Assembled by hand: the ClusterRole and ClusterRoleBinding are upstream's kubernetes-crd-rbac.yml
# (renamed to traefik, without the OTel-only pods rule); the rest is written here. Renovate is off
# for this file: Jevil proposes a re-vendor with each Traefik release, carrying upstream's RBAC
# changes and moving the traefik image with it, together with crds.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: traefik
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: traefik
rules:
  - apiGroups:
      - ""
    resources:
      - services
      - secrets
      - nodes
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - list
      - watch
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses
      - ingressclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses/status
    verbs:
      - update
  - apiGroups:
      - traefik.io
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - tlsoptions
      - tlsstores
      - traefikservices
      - serverstransports
      - serverstransporttcps
    verbs:
      - get
      - list
      - watch
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: traefik
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
spec:
  type: LoadBalancer
  # Use Cluster policy so traffic is accepted regardless of announcing node,
  # which helps subnet-routed clients on overlapping RFC1918 networks.
  externalTrafficPolicy: Cluster
  ports:
    - name: web
      port: 80
      targetPort: web
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
  selector:
    app: traefik
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
  labels:
    app: traefik
spec:
  replicas: 2
  # Never drop below 2 serving replicas: surge one new pod, wait until it is
  # Ready (routes loaded, see readinessProbe) plus minReadySeconds so kube-proxy
  # has programmed its endpoint, and only then terminate an old pod.
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
      annotations:
        # The bouncer plugin starts its LAPI stream ticker once per process, bound to
        # the first crowdsec-bouncer Middleware it builds; later Middleware edits do not
        # reach it (e.g. updateMaxFailure). Bump this when changing stream settings
        # (crowdsecMode, updateIntervalSeconds, updateMaxFailure, LAPI host/key).
        checksum/bouncer-stream: "update-max-failure-60"
        # /metrics on the internal traefik entrypoint (:8080, not in the Service).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: traefik
      # One replica per node, so a single node loss never takes out both. The surge
      # pod lands on the third node during a rollout.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: traefik
              topologyKey: kubernetes.io/hostname
      # Covers requestAcceptGraceTimeout (10s) + the default graceTimeOut (10s).
      terminationGracePeriodSeconds: 40
      containers:
        - name: traefik
          image: traefik:v3.7.17
          args:
            - --api.insecure=true
            # /ping on the internal traefik entrypoint (:8080, not in the Service).
            - --ping=true
            - --providers.kubernetesingress
            - --providers.kubernetescrd
            - --providers.kubernetescrd.allowCrossNamespace=true
            - --entrypoints.web.address=:80
            - --entrypoints.websecure.address=:443
            - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=600s
            - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=600s
            # On SIGTERM keep accepting requests while the pod is removed from the
            # Service endpoints, then drain in-flight requests (graceTimeOut).
            - --entrypoints.web.transport.lifeCycle.requestAcceptGraceTimeout=10s
            - --entrypoints.websecure.transport.lifeCycle.requestAcceptGraceTimeout=10s
            # Trust forwarded headers from any source (for real client IP)
            - --entrypoints.web.forwardedHeaders.insecure=true
            - --entrypoints.websecure.forwardedHeaders.insecure=true
            - --log.level=INFO
            # Enable access logs for CrowdSec to parse
            - --accesslog=true
            - --accesslog.format=json
            # Prometheus metrics on the traefik entrypoint. Router labels give the
            # per-app request rate, status and latency for the Traefik dashboard.
            - --metrics.prometheus=true
            - --metrics.prometheus.addRoutersLabels=true
            # Enable CrowdSec bouncer plugin (downloaded from plugins.traefik.io at
            # startup; see startupProbe for what happens when that fails)
            - --experimental.plugins.bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
            - --experimental.plugins.bouncer.version=v1.4.6
          ports:
            - name: web
              containerPort: 80
            - name: websecure
              containerPort: 443
            - name: admin
              containerPort: 8080
          # Traefik downloads the plugin once per process and does not retry: if that
          # download fails (a node that just booted and has no egress yet), it logs
          # "Plugins are disabled", keeps running, and disables each plugin Middleware
          # with "invalid middleware type", so every route behind crowdsec-bouncer
          # (Pocket ID) 404s while /ping stays green. Startup therefore waits for the
          # CRD routes (see readinessProbe) and fails while a plugin Middleware is
          # disabled that way. After 2 minutes (60 x 2s) kubelet restarts the container,
          # whose new process downloads again, and keeps restarting it until a download
          # succeeds: one attempt every 2-7 minutes (the 2-minute window plus kubelet's
          # restart backoff, capped at 5m). The pod stays out of the Service meanwhile,
          # so the other replica takes the traffic. With
          # maxUnavailable 0 a rollout that cannot load the plugin stops before it
          # replaces a working replica. Only Middlewares with a plugin section match,
          # so a broken Middleware of any other type cannot hold Traefik back.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  wget -qO /dev/null http://127.0.0.1:8080/ping &&
                  wget -qO- 'http://127.0.0.1:8080/api/http/routers?search=%40kubernetescrd&per_page=1'
                  | grep -q '"provider":"kubernetescrd"' &&
                  ! wget -qO- 'http://127.0.0.1:8080/api/http/middlewares?status=disabled&per_page=1000'
                  | sed 's/},{"/}\n{"/g' | grep '"plugin":{' | grep -q 'invalid middleware type'
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /ping
              port: admin
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # /ping only says the process is up and not terminating: it is served by
          # the internal provider and returns 200 before the Kubernetes CRD provider
          # has delivered any routes. The CRD provider sends its first configuration
          # only after its informer caches have synced, so the presence of any
          # @kubernetescrd router means the full route set is loaded.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  wget -qO /dev/null http://127.0.0.1:8080/ping &&
                  wget -qO- 'http://127.0.0.1:8080/api/http/routers?search=%40kubernetescrd&per_page=1'
                  | grep -q '"provider":"kubernetescrd"'
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: traefik-data
              mountPath: /data
            # Read by the bouncer plugin via crowdsecLapiKeyFile, so the key never
            # appears in a Middleware manifest.
            - name: crowdsec-key
              mountPath: /etc/crowdsec
              readOnly: true
      volumes:
        - name: traefik-data
          emptyDir: {}
        - name: crowdsec-key
          secret:
            secretName: crowdsec-bouncer-key
