---
# Talos version for every node. Merging a change here upgrades the cluster: tuppr drains,
# upgrades and reboots one node at a time, and the health checks below gate each node.
# Bumped by Renovate in the single "Talos and Kubernetes" PR together with the installer
# image in talos/*.yaml. Talos only supports stepping through each minor in turn and tuppr
# does not enforce it: never skip a minor (see renovate.json, separateMultipleMinor).
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: cluster
spec:
  talos:
    # renovate: datasource=github-releases depName=siderolabs/talos
    version: v1.14.5
  policy:
    # The CRD defaults this to true (v0.5.9), despite the docs.
    debug: false
    # talosctl drains the node itself during the upgrade and retries an eviction a PDB
    # refuses until drainTimeout. Longhorn releases a node's instance-manager PDB only once
    # its volumes have detached, so the drain cannot finish (and the node cannot reboot)
    # with a volume still attached there. 35m covers qbittorrent's 30m termination grace
    # period, as in scripts/talos-sync.sh.
    drainTimeout: 35m
    # Not waitForVolumeDetach: it makes tuppr drain instead, and tuppr's drain (v0.5.10)
    # gives up on the first eviction a PDB refuses. Pods are evicted in namespace order, so
    # longhorn-system/instance-manager is refused before the app pods holding its volumes
    # have moved, and the run loops in Draining without ever draining a node.
    waitForVolumeDetach: false
    # timeout covers the drain plus install, reboot and the node turning Ready again.
    timeout: 60m
  healthChecks:
    - description: every node Ready
      apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
      timeout: 15m
    # A reboot takes one replica of every volume down. Wait until the previous node's
    # replicas have resynced (rebuilds are limited to one per node, so this can take
    # ~20m). tuppr's CEL only sees an object's status: a `spec.` reference fails
    # validation and parks the run in HealthChecking for good (seen with v1.14.5), so the
    # replica count is not checked here. A node holding an attached volume's only
    # replica cannot drain: Longhorn's drain policy blocks it and talosctl fails the
    # upgrade after drainTimeout without rebooting.
    - description: every attached Longhorn volume healthy
      apiVersion: longhorn.io/v1beta2
      kind: Volume
      namespace: longhorn-system
      expr: status.state != "attached" || status.robustness == "healthy"
      timeout: 2h
